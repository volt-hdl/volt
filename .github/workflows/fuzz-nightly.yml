name: Fuzz nightly

# Long fuzz run, kept out of PR CI (ci.yml runs a 60 s smoke fuzz instead).
# The corpus is carried over night to night through actions/cache: each run
# restores the newest saved corpus, fuzzes on top of it and saves the grown
# corpus under a new key (cache entries are immutable). A crash input is
# uploaded as an artifact.
on:
  schedule:
    - cron: "0 3 * * *" # every day, 03:00 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: "Fuzz duration in seconds"
        required: false
        default: "1800"

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz parse_never_panics (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FUZZ_SECONDS: ${{ inputs.seconds || '1800' }}
      CORPUS: fuzz/corpus/parse_never_panics
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Restore corpus
        id: corpus
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CORPUS }}
          key: fuzz-corpus-parse_never_panics-${{ github.run_id }}
          restore-keys: fuzz-corpus-parse_never_panics-
      - name: Corpus size before
        run: |
          [[ "$FUZZ_SECONDS" =~ ^[1-9][0-9]*$ ]] || { echo "seconds must be a positive integer: $FUZZ_SECONDS"; exit 1; }
          mkdir -p "$CORPUS"
          echo "restored key: ${{ steps.corpus.outputs.cache-matched-key || '(none)' }}"
          echo "corpus files before: $(find "$CORPUS" -type f | wc -l)"
      # First corpus dir receives new inputs; tests/ui and the fuzz regression
      # inputs (ADR-0067) are read-only seeds.
      - name: parse_never_panics (${{ env.FUZZ_SECONDS }} s)
        id: fuzz
        run: |
          cargo +nightly fuzz run parse_never_panics \
            "$GITHUB_WORKSPACE/$CORPUS" \
            "$GITHUB_WORKSPACE/tests/ui" "$GITHUB_WORKSPACE/tests/fuzz_regressions" \
            -- -max_total_time="$FUZZ_SECONDS"
      - name: Corpus size after
        if: always()
        run: |
          echo "corpus files after: $(find "$CORPUS" -type f | wc -l)"
      # Saved even when the fuzzer found a crash, so the next night keeps the
      # coverage reached so far. Skipped when the fuzzer never ran.
      - name: Save corpus
        if: always() && (steps.fuzz.outcome == 'success' || steps.fuzz.outcome == 'failure')
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CORPUS }}
          key: fuzz-corpus-parse_never_panics-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload crash input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-parse_never_panics-${{ github.run_id }}
          path: fuzz/artifacts/parse_never_panics/
          retention-days: 30
