name: Fuzz nightly

# Long fuzz run, kept out of PR CI (ci.yml runs a 120 s fuzz from the seeds
# instead). The corpus is carried over night to night through actions/cache:
# each run restores the newest saved corpus, shrinks it with libFuzzer's
# -merge=1 to the inputs that add coverage, fuzzes on top of the merged
# corpus and saves it under a new key (cache entries are immutable).
#
# The run fails closed (ADR-0143, #305): scripts/ci/fuzz_health.py reads the
# time-stamped libFuzzer logs and turns the run red when the replay of the
# corpus did not end (no INITED), the run did not end (no Done), or the real
# fuzz time (INITED -> Done) is below half the budget; the corpus is saved
# when the replay of the merged corpus reached the coverage the merge
# measured on the restored corpus, and not otherwise. libFuzzer's files (slow-unit, crash,
# timeout, oom) are uploaded on every run, green or red.
#
# 18:40 UTC (ADR-0123): 19 minutes after metamorphic-nightly.yml (18:21)
# and 97 after difftest.yml (17:03); GitHub starts scheduled runs 6.5 to
# 8.6 hours late, so the night runs in the Turkish evening or night.
on:
  schedule:
    - cron: "40 18 * * *" # every day, 18:40 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: "Fuzz duration in seconds"
        required: false
        default: "1800"

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz parse_never_panics (nightly)
    runs-on: ubuntu-24.04
    # Build and install ~3 min, merge at most 35, fuzz at most 45 (budget
    # 30 min plus the replay of the merged corpus).
    timeout-minutes: 90
    defaults:
      run:
        # bash -eo pipefail: a failing libFuzzer is not hidden by the pipe
        # into fuzz_health.py stamp.
        shell: bash
    env:
      FUZZ_SECONDS: ${{ inputs.seconds || '1800' }}
      CORPUS: fuzz/corpus/parse_never_panics
      ARTIFACTS: fuzz/artifacts/parse_never_panics
      # ADR-0143. -max_len is fixed (ADR-0080 §6): otherwise libFuzzer takes
      # the largest seed as the limit, and the 60 KB stack_* regressions made
      # every mutated input up to 60 KB (1221 -> 713 exec/s); a 4 KB prefix
      # still nests past the 256-level depth limit. -timeout=10: the slowest
      # input of at most 4 KB takes ~1.6 s in the fuzz build after #449; the
      # 25-35 s inputs of #446 ran under the default 1200 s and the night
      # stayed green. -report_slow_units=2: every input slower than any
      # known one is written as a slow-unit file and uploaded.
      FUZZ_FLAGS: -max_len=4096 -timeout=10 -report_slow_units=2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          # Cargo.toml's profiles are not in rust-cache's own key (it hashes
          # the dependencies only): a profile change starts a new cache.
          key: ${{ hashFiles('Cargo.toml') }}
          workspaces: |
            .
            fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
          env-vars: ImageOS
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz health self-test (scripts/ci/fuzz_health.py)
        run: python3 scripts/ci/fuzz_health.py --self-test
      # A cache saved by a run on another branch is visible to that branch
      # alone: a workflow_dispatch on a branch never feeds main's chain.
      - name: Restore corpus
        id: corpus
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CORPUS }}
          key: fuzz-corpus-parse_never_panics-${{ github.run_id }}
          restore-keys: fuzz-corpus-parse_never_panics-
      # The restored corpus moves aside; the merge writes the new one where
      # the cache path expects it. Inputs longer than -max_len are cut to
      # it beforehand: libFuzzer reads just that prefix of them anyway, so the
      # merge keeps exactly what the fuzzer saw and no corpus file is longer.
      - name: Restored corpus
        id: restored
        run: |
          [[ "$FUZZ_SECONDS" =~ ^[1-9][0-9]*$ ]] || { echo "::error::seconds must be a positive integer: $FUZZ_SECONDS"; exit 1; }
          echo "restored key: ${{ steps.corpus.outputs.cache-matched-key || '(none)' }}"
          mkdir -p "$CORPUS"
          OLD="$RUNNER_TEMP/corpus-restored"
          mv "$CORPUS" "$OLD"
          mkdir -p "$CORPUS"
          files=$(find "$OLD" -type f | wc -l)
          bytes=$(find "$OLD" -type f -printf '%s\n' | awk '{ s += $1 } END { print s + 0 }')
          over=$(find "$OLD" -type f -size +4096c | wc -l)
          find "$OLD" -type f -size +4096c -exec truncate -s 4096 {} +
          echo "restored corpus: $files files, $bytes bytes, $over longer than 4096 bytes (cut to 4096)"
          { echo "files=$files"; echo "bytes=$bytes"; echo "over=$over"; echo "dir=$OLD"; } >> "$GITHUB_OUTPUT"
      # -merge=1 into the empty corpus directory: libFuzzer keeps the inputs
      # that add coverage (#305: 14158 of 115692 useful). With nothing
      # restored there is nothing to merge; the fuzz step starts from the
      # seeds.
      - name: Shrink the corpus (-merge=1)
        id: merge
        if: steps.restored.outputs.files != '0'
        timeout-minutes: 35
        env:
          OLD: ${{ steps.restored.outputs.dir }}
        run: |
          set -o pipefail
          read -ra flags <<< "$FUZZ_FLAGS"
          start=$(date +%s)
          cargo +nightly fuzz run parse_never_panics \
            "$GITHUB_WORKSPACE/$CORPUS" "$OLD" \
            -- -merge=1 "${flags[@]}" \
            2>&1 | python3 scripts/ci/fuzz_health.py stamp --out "$RUNNER_TEMP/merge.log"
          echo "merge: $(( $(date +%s) - start )) s; corpus files after the merge: $(find "$CORPUS" -type f | wc -l)"
      # The leading corpus dir receives new inputs; libFuzzer never writes to
      # the seeds, tests/ui and the fuzz regression inputs (ADR-0067).
      - name: parse_never_panics (${{ env.FUZZ_SECONDS }} s)
        id: fuzz
        timeout-minutes: 45
        run: |
          set -o pipefail
          read -ra flags <<< "$FUZZ_FLAGS"
          cargo +nightly fuzz run parse_never_panics \
            "$GITHUB_WORKSPACE/$CORPUS" \
            "$GITHUB_WORKSPACE/tests/ui" "$GITHUB_WORKSPACE/tests/fuzz_regressions" \
            -- -max_total_time="$FUZZ_SECONDS" "${flags[@]}" \
            2>&1 | python3 scripts/ci/fuzz_health.py stamp --out "$RUNNER_TEMP/fuzz.log"
      # Runs unless the run was cancelled, so a failed or skipped merge or
      # fuzz step still gets its verdict: this step fails when either log is
      # missing or incomplete (ADR-0143).
      - name: Fuzz health (fail closed)
        id: health
        if: ${{ !cancelled() }}
        run: |
          merge=()
          if [ "${{ steps.restored.outputs.files }}" != "" ]; then
            merge=(--merge-log "$RUNNER_TEMP/merge.log"
                   --restored-files "${{ steps.restored.outputs.files }}"
                   --restored-bytes "${{ steps.restored.outputs.bytes }}"
                   --restored-over "${{ steps.restored.outputs.over }}")
          fi
          python3 scripts/ci/fuzz_health.py check \
            --log "$RUNNER_TEMP/fuzz.log" --budget "$FUZZ_SECONDS" "${merge[@]}" \
            --corpus "$CORPUS" --artifacts "$ARTIFACTS" \
            --title "Fuzz parse_never_panics (nightly, ${FUZZ_SECONDS} s)"
      # Saved when the merged corpus kept the restored corpus' coverage,
      # even when the fuzzer found a crash (the next night keeps the
      # coverage reached); "Fuzz health" above is red in that case.
      - name: Save corpus
        if: ${{ !cancelled() && steps.health.outputs.corpus_ok == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CORPUS }}
          key: fuzz-corpus-parse_never_panics-${{ github.run_id }}-${{ github.run_attempt }}
      # Every run, green or red: slow-unit files come from green runs too
      # (#446's inputs were lost because red runs alone uploaded them). An
      # empty directory uploads nothing and does not fail.
      - name: Upload fuzz artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-parse_never_panics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ARTIFACTS }}/
          if-no-files-found: ignore
          retention-days: 30
