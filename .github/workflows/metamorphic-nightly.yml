name: Metamorphic test (nightly)

# ADR-0117 section 5 (#254): every rewrite on the whole corpus — tests/ui,
# examples/, the book's ```volt blocks and tests/real_bugs/ — with Verilator
# required (VOLT_METAMORPHIC_TIER=nightly). The PR tier (tests/real_bugs/
# and tests/ui/) runs in ci.yml's tool job on every pull request.
#
# A red night opens an issue with a fixed title, or adds the report as a
# comment to the open one: a red run is never only a red mark in the
# Actions tab. A green night writes nothing.
#
# 18:21 UTC (ADR-0123): 78 minutes after difftest.yml (17:03) and 19 before
# fuzz-nightly.yml (18:40). GitHub starts scheduled runs 6.5 to 8.6 hours
# late; on time the night runs in the Turkish evening, 8 hours late in
# the Turkish night, apart from the pull requests' daytime CI.

on:
  schedule:
    - cron: "21 18 * * *"
  workflow_dispatch:
    inputs:
      ccache:
        description: "ccache for the Verilator builds (off: the same run without it)"
        type: choice
        options: ["on", "off"]
        default: "on"

permissions:
  contents: read

concurrency:
  group: metamorphic-nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  VOLT_TOOL_LEDGER: /tmp/volt-tool-ledger.tsv
  VOLT_METAMORPHIC_SUMMARY: /tmp/volt-metamorphic.txt
  VOLT_REAL_BUGS_SUMMARY: /tmp/volt-real-bugs.txt

jobs:
  nightly:
    name: Metamorphic test, whole corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      seed: ${{ steps.seed.outputs.seed }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          env-vars: ImageOS
      # Verilator is the pinned release (#145); the action fails the job on
      # any other `verilator --version`.
      - name: Pinned Verilator (scripts/ci/verilator.env)
        uses: ./.github/actions/verilator
      # The C++ of every Verilator build through ccache, the cache kept
      # between nights (.github/actions/ccache).
      - name: ccache for the Verilator builds
        uses: ./.github/actions/ccache
        with:
          phase: start
          job: metamorphic-nightly
          enabled: ${{ inputs.ccache || 'on' }}
      # The night's stimulus seed is the night's UTC date (ADR-0117 section
      # 5, ADR-0123): the UTC date 12 hours before the run starts, so a
      # night that starts late, past midnight, keeps its date and two
      # nights never share a seed (scripts/ci/nightly_seed.py). The test
      # derives each design's stimulus from it and the design's id. It is
      # printed here, in the job summary, in the report and in the issue
      # of a red night; VOLT_METAMORPHIC_SEED=<seed> repeats the run anywhere.
      - name: Night's date self-test (scripts/ci/nightly_seed.py)
        run: python3 scripts/ci/nightly_seed.py --self-test
      - name: Seed of this night
        id: seed
        run: |
          set -euo pipefail
          seed=$(python3 scripts/ci/nightly_seed.py --kind metamorphic)
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "::notice title=Metamorphic nightly seed::VOLT_METAMORPHIC_SEED=$seed; the night's UTC date (start $(date -u +%Y-%m-%dT%H:%M:%SZ) minus 12 h)"
          {
            echo "### Metamorphic nightly: seed $seed"
            echo
            echo '```text'
            echo "VOLT_METAMORPHIC_TIER=nightly VOLT_METAMORPHIC_SEED=$seed VOLT_REQUIRE_TOOLS=verilator cargo test -p volt-driver --test metamorphic_tests"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Metamorphic test and real-bug corpus (Verilator required)
        env:
          VOLT_REQUIRE_TOOLS: verilator
          VOLT_METAMORPHIC_TIER: nightly
          VOLT_METAMORPHIC_SEED: ${{ steps.seed.outputs.seed }}
        run: cargo test -p volt-driver --test metamorphic_tests -- --nocapture
      - name: Reports
        if: always()
        run: |
          for f in "$VOLT_REAL_BUGS_SUMMARY" "$VOLT_METAMORPHIC_SUMMARY"; do
            if [ ! -s "$f" ]; then
              echo "::error title=Metamorphic test::$f is missing: the test did not run"
              exit 1
            fi
            cat "$f"
            echo
          done
      - name: ccache statistics, cache save
        if: always()
        uses: ./.github/actions/ccache
        with:
          phase: end
          job: metamorphic-nightly
          job-status: ${{ job.status }}
      - name: Tool ledger - SKIP count
        if: always()
        run: python3 scripts/ci/tool_ledger.py report "$VOLT_TOOL_LEDGER" --job metamorphic-nightly --require-zero-skips --min-ran 1
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metamorphic-nightly-reports
          path: |
            /tmp/volt-metamorphic.txt
            /tmp/volt-real-bugs.txt
          if-no-files-found: ignore

  # A red night: open the issue, or comment on the open one.
  report:
    name: Open or update the issue of a red night
    needs: nightly
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      # The step below is scripts/ci/nightly_issue.py; its self-test (a
      # fake gh) runs on every pull request in known-failures.yml and here.
      - name: Script self-test
        run: python3 scripts/ci/nightly_issue.py --self-test
      - name: Download the reports
        uses: actions/download-artifact@v7
        with:
          name: metamorphic-nightly-reports
          path: reports
        # A missing artifact (the test never ran) still opens the issue: the
        # next step says the reports are missing.
        continue-on-error: true
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SEED: ${{ needs.nightly.outputs.seed }}
        run: |
          python3 scripts/ci/nightly_issue.py report --kind metamorphic --run-url "$RUN_URL" --seed "$SEED" --report reports/volt-real-bugs.txt --report reports/volt-metamorphic.txt
