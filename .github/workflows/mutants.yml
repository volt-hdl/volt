name: Mutation test

# ADR-0109: mutation testing with cargo-mutants. It measures the tests, not
# the compiler: each mutant is one small change in a file in scope
# (.cargo/mutants.toml: every crate's src/ but the files listed there), and
# a mutant that the whole test suite lets through is "missed". MUTANTS_SHARDS
# shards (cargo mutants --shard k/N), each with the tools of the CI tool job
# and VOLT_REQUIRE_TOOLS=all, so that no tool test skips (ADR-0107). Every
# shard uploads its mutants.out, even when it is stopped; the last job merges
# them into the job summary and names every shard that did not complete.
#
# Two kinds of run, one shard job (ADR-0109 appendix "PR kapısı"):
#
# - The pull-request gate, on every pull request: the mutants on the lines
#   the pull request changes (cargo mutants --in-diff, the diff of the merge
#   commit against its first parent). The summary fails on every missed
#   mutant that no exclude_re entry covers and lists the classification
#   rules. A pull request that changes no Rust source in scope has nothing to
#   test: the run passes and its summary says so. A new push cancels the run
#   of the previous one. Not a required check (the maintainer decides).
#   The gate runs on opened, synchronize and reopened, never on `edited`:
#   the check of the exclude_re entries (#239, #283) is a workflow of its
#   own, mutants-exclusions.yml, which also runs on `edited`.
#   By hand on a branch: `-f gate_base=<revision>` (the lines changed since).
#   Reuse (#318, ADR-0109 appendix "Kapının önceki sonucu"): before any
#   shard starts, the first job computes a reuse key (the mutants before the
#   exclusions, the merge commit's tree without the inert paths of
#   scripts/ci/mutants_inert.txt, the environment: .cargo/mutants.toml
#   without exclude_re, this workflow, the Verilator pin, the tool versions,
#   rustc, the runner image). When an earlier gate run of the same pull
#   request (not a fork, not a hand run) has the same key and every shard of
#   it completed with no missed, timeout or memory-limit mutant and SKIP: 0,
#   no shard runs: the summary gives the verdict from that run's outcomes,
#   with today's exclude_re re-applied, and names it ("reused: run <id> (SHA
#   <sha>), key <hash>"). Anything else runs the gate in full. The earlier
#   result comes from that run's artifacts through the API, checked against
#   the digests GitHub recorded, never from actions/cache. Every shard
#   deletes the inert paths before its baseline, so its outcomes never
#   depend on them.
# - A full or targeted run, by hand (workflow_dispatch): a measurement; a
#   missed mutant does not fail it.
#
# A push to main runs one job, cache-warm: the Rust cache the shards restore
# (Rust caches are saved on main only).
#
#   gh workflow run mutants.yml --ref <branch>
#   gh workflow run mutants.yml --ref <branch> -f re='scope\.rs' -f expect=<n> [-f shards=2]
#   gh workflow run mutants.yml --ref <branch> -f gate_base=<revision>
#
# Targeted run (ADR-0109, "Hedefli koşu"): `re` keeps the mutants whose
# names (as `cargo mutants --list` prints them) the regex matches. cargo-mutants
# 27.1.0 lets field-deletion mutants through --re, so the list is narrowed a
# second time by line (--in-diff, scripts/ci/mutants_target.py) and the
# first job fails unless every mutant in the final list matches `re` and
# the list holds exactly `expect` mutants, the number the regex was written
# for (#253: run 43754250315's regex missed one of its two mutants and the
# run went green). `re` needs `expect`.
#
# Test order (ADR-0128, #366): the shards run nextest with the profile
# `mutants` of .config/nextest.toml: the test binaries the pull request
# touches first, every crate's tests but volt-driver's next, the slow
# Verilator binaries of volt-driver last. A caught mutant stops at its
# first failing test, so the order decides how soon; it never decides
# whether a test runs. The input `nextest_order` (temporary, for the
# reference comparisons of ADR-0128) runs the default order instead:
#
#   gh workflow run mutants.yml --ref <branch> -f gate_base=<revision> -f nextest_order=default
#
# Two runs are compared mutant by mutant with scripts/ci/mutants_compare.py.
#
# Memory (#160): every build and test of a shard runs under
# scripts/ci/mutants_watchdog.py, which kills the largest process of the
# tree when the tree holds more than MUTANTS_MEMORY_LIMIT_MIB; the mutant is
# reported as "memory limit" (caught) and the shard goes on. The time of a
# mutant stays limited by cargo-mutants (--timeout, --build-timeout).

on:
  # Not `edited` (mutants-exclusions.yml): editing the description of a pull
  # request does not start the gate again.
  pull_request:
    types: [opened, synchronize, reopened]
  # Only the cache-warm job runs on a push: the Rust cache of the shards.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      re:
        description: "Regex over mutant names: try only the matching mutants (empty: every mutant in scope)"
        required: false
        default: ""
      expect:
        description: "With re (required): the number of mutants the regex was written for; the run fails when the list holds another number"
        required: false
        default: ""
      shards:
        description: "Number of shards, 1-20 (empty: ADR-0109 section 3 from the number of mutants)"
        required: false
        default: ""
      gate_base:
        description: "The pull-request gate by hand: the mutants on the lines changed since this revision (empty: a full or targeted run)"
        required: false
        default: ""
      # Temporary (ADR-0128, #366): the reference comparisons run the same
      # commit in both orders. Removed once ADR-0128 is decided.
      nextest_order:
        description: "Test order (temporary, ADR-0128): priority = nextest profile mutants (the gate's order); default = nextest's default order (before ADR-0128)"
        required: false
        type: choice
        options: [priority, default]
        default: priority

permissions:
  contents: read

# A new push to a pull request cancels the gate run of the push before. A run
# by hand is a group of its own and is never cancelled by another run.
concurrency:
  group: mutants-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_MUTANTS_VERSION: 27.1.0
  CARGO_NEXTEST_VERSION: 0.9.151
  # Inputs reach the shell through the environment, never inline.
  MUTANTS_RE: ${{ inputs.re }}
  MUTANTS_EXPECT: ${{ inputs.expect }}
  MUTANTS_GATE_BASE: ${{ inputs.gate_base }}
  # ADR-0128: priority on a pull request and by default; `default` only
  # when a run by hand asks for it.
  MUTANTS_NEXTEST_ORDER: ${{ inputs.nextest_order || 'priority' }}
  # #160: the resident memory of a shard's process tree (cargo mutants and
  # everything under it, or the baseline). The runner has 16 GiB; above this
  # the watchdog kills the largest process instead of the kernel killing the
  # runner.
  MUTANTS_MEMORY_LIMIT_MIB: "12288"
  # ADR-0109 appendix "PR kapısı": t of the gate's shard plan (section 3's
  # rule with a measured t): the slowest shard's mean of the targeted runs
  # 43196528987, 43227504453 and 43269045494 was 568 s a mutant.
  MUTANTS_GATE_SECONDS_PER_MUTANT: "600"
  OSS_CAD_SUITE_DATE: 2026-09-21
  VOLT_TOOL_LEDGER: /tmp/volt-tool-ledger.tsv
  # No debug info: smaller target, faster links; a mutant is rebuilt ~75
  # times per shard.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # The Rust cache of the shards (.github/workflows/README.md, "Rust
  # önbelleği"). Rust caches are saved on main only, and the gate never runs
  # on main: on every push to main this job restores the shards' cache
  # (shared-key mutants, the same workflow env, so the same key) and, when
  # the key has changed (Cargo.lock, the toolchain, the image), builds what a
  # shard's baseline builds and saves it. Every pull request's shards restore
  # it. Nothing else of this workflow runs on a push.
  cache-warm:
    name: Rust cache of the shards (main)
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          shared-key: mutants
          save-if: ${{ github.ref == 'refs/heads/main' }}
          env-vars: ImageOS
      # cargo nextest run --no-run is cargo test --no-run underneath: the
      # same dependency builds. CARGO_INCREMENTAL as in the shard's baseline.
      - name: Build every workspace test (what a shard's baseline builds)
        if: steps.rust-cache.outputs.cache-hit != 'true'
        env:
          CARGO_INCREMENTAL: "1"
        run: cargo test --workspace --no-run
      - name: The cache is up to date
        if: steps.rust-cache.outputs.cache-hit == 'true'
        run: echo "::notice title=Rust cache of the shards::exact key restored; nothing to build or save"

  tools:
    name: Tools and the mutants in scope
    # A push to main only warms the cache (cache-warm); the shards and the
    # summary need this job, so they do not run either.
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # actions: read: the earlier gate runs of this pull request and their
    # artifacts (#318).
    permissions:
      contents: read
      actions: read
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      matrix: ${{ steps.shards.outputs.matrix }}
      mode: ${{ steps.list.outputs.mode }}
      reuse_run: ${{ steps.reuse.outputs.run }}
      reuse_sha: ${{ steps.reuse.outputs.sha }}
      reuse_key: ${{ steps.reuse.outputs.key }}
    steps:
      # The whole history: the gate diffs against the merge commit's first
      # parent or against gate_base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo-mutants and cargo-nextest
        id: tools-cache
        uses: actions/cache@v6
        with:
          path: ~/mutants-tools
          key: mutants-tools-${{ runner.os }}-${{ env.CARGO_MUTANTS_VERSION }}-${{ env.CARGO_NEXTEST_VERSION }}
      - name: Build cargo-mutants and cargo-nextest (pinned versions)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --root ~/mutants-tools cargo-mutants --version "$CARGO_MUTANTS_VERSION"
          cargo install --locked --root ~/mutants-tools cargo-nextest --version "$CARGO_NEXTEST_VERSION"
      - name: Script self-tests
        run: |
          python3 scripts/ci/mutants_target.py --self-test
          python3 scripts/ci/mutants_summary.py --self-test
          python3 scripts/ci/mutants_watchdog.py --self-test
          python3 scripts/ci/mutants_reuse.py --self-test
          python3 scripts/ci/mutants_nextest.py --self-test
          python3 scripts/ci/mutants_compare.py --self-test
      # The filter of the run (mutants-list/filter.txt), which every later
      # `cargo mutants` call takes:
      # - gate: --in-diff of the Rust files changed since the base;
      # - targeted run: the --re list, narrowed by line to the names the
      #   regex matches (target.diff), and the proof that the final list
      #   holds only those;
      # - full run: no filter.
      - name: Mutants of the run (.cargo/mutants.toml, the gate's diff or input re)
        id: list
        env:
          CARGO_TERM_COLOR: never
        run: |
          export PATH="$HOME/mutants-tools/bin:$PATH"
          cargo mutants --version
          cargo nextest --version
          mkdir -p mutants-list
          : > mutants-list/filter.txt
          mode=run
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            mode=gate
            base=$(git rev-parse HEAD^1)
          elif [ -n "$MUTANTS_GATE_BASE" ]; then
            mode=gate
            base=$(git rev-parse --verify "$MUTANTS_GATE_BASE^{commit}")
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ -n "$MUTANTS_EXPECT" ] && [ -z "$MUTANTS_RE" ]; then
            echo "::error title=Mutation test::expect goes with re (the number of mutants the regex was written for)"
            exit 1
          fi
          if [ "$mode" = gate ]; then
            if [ -n "$MUTANTS_RE" ]; then
              echo "::error title=Mutation gate::re and gate_base exclude each other"
              exit 1
            fi
            # Rust files alone: cargo-mutants parses the diff, renames as a
            # delete and an add.
            git diff --no-ext-diff --no-color --no-renames "$base" HEAD -- '*.rs' > mutants-list/pr.diff
            git diff --name-only --no-renames --diff-filter=d "$base" HEAD -- '*.rs' | sort > mutants-list/changed.txt
            cargo mutants --list-files | sort > mutants-list/files.txt
            comm -12 mutants-list/changed.txt mutants-list/files.txt > mutants-list/changed-in-scope.txt
            changed=$(wc -l < mutants-list/changed.txt)
            in_scope=$(wc -l < mutants-list/changed-in-scope.txt)
            echo "Gate: the Rust lines changed since $base ($(git log -1 --format=%h "$base")): $changed file(s), $in_scope in scope"
            if [ "$in_scope" -eq 0 ]; then
              : > mutants-list/all.txt
              if [ "$changed" -eq 0 ]; then
                echo "No Rust file changed since $(git log -1 --format=%h "$base")." > mutants-list/note.txt
              else
                echo "$changed Rust file(s) changed since $(git log -1 --format=%h "$base"), none in the mutation scope: $(paste -sd' ' mutants-list/changed.txt)" > mutants-list/note.txt
              fi
            else
              printf '%s\n' --in-diff mutants-list/pr.diff > mutants-list/filter.txt
              mapfile -t filter < mutants-list/filter.txt
              cargo mutants --list "${filter[@]}" > mutants-list/all.txt
              # #283: the same list before the exclusions; the summary names
              # the mutants a C entry excludes, with their issue.
              python3 scripts/ci/mutants_exclusions.py list --out mutants-list/unexcluded.txt -- "${filter[@]}"
              if [ ! -s mutants-list/all.txt ]; then
                echo "$in_scope Rust file(s) in scope changed since $(git log -1 --format=%h "$base"), but the changed lines hold no mutant: $(paste -sd' ' mutants-list/changed-in-scope.txt)" > mutants-list/note.txt
              else
                echo "Gate: the mutants on the Rust lines changed since $(git log -1 --format=%h "$base") ($in_scope file(s) in scope)." > mutants-list/note.txt
              fi
            fi
            cat mutants-list/note.txt
            exit 0
          fi
          if [ -n "$MUTANTS_RE" ]; then
            cargo mutants --list --re "$MUTANTS_RE" > mutants-list/re.txt
            python3 scripts/ci/mutants_target.py diff --re "$MUTANTS_RE" --list mutants-list/re.txt --out mutants-list/target.diff
            printf '%s\n' --re "$MUTANTS_RE" --in-diff mutants-list/target.diff > mutants-list/filter.txt
          fi
          mapfile -t filter < mutants-list/filter.txt
          cargo mutants --list "${filter[@]}" > mutants-list/all.txt
          if [ -n "$MUTANTS_RE" ]; then
            python3 scripts/ci/mutants_target.py check --re "$MUTANTS_RE" --list mutants-list/all.txt --expect "$MUTANTS_EXPECT"
            echo "::notice title=Targeted mutation run::$(wc -l < mutants-list/all.txt) mutants match the regex $MUTANTS_RE"
          fi
      # #318 (ADR-0109 appendix "Kapının önceki sonucu"): the reuse key of
      # this gate run (mutants-list/key.json, uploaded with the lists, so a
      # later run can compare with it) and an earlier gate run of this pull
      # request with the same key and a clean, complete result
      # (scripts/ci/mutants_reuse.py says what is checked). When one is
      # found, no shard runs: steps.reuse.outputs.run names it and
      # mutants-list/reuse/ holds its lists and outcomes for the summary.
      # Anything else, an error of the API too, runs the gate in full, and
      # the log says why.
      - name: Reuse key, and an earlier passed run of this pull request with the same key
        id: reuse
        if: ${{ steps.list.outputs.mode == 'gate' }}
        env:
          CARGO_TERM_COLOR: never
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          export PATH="$HOME/mutants-tools/bin:$PATH"
          if [ ! -s mutants-list/all.txt ]; then
            echo "No mutant to test: no reuse key."
            exit 0
          fi
          python3 scripts/ci/mutants_reuse.py key --lists mutants-list
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "A gate run by hand (gate_base): reuse is for pull_request runs only; the gate runs in full."
            exit 0
          fi
          python3 scripts/ci/mutants_reuse.py find --lists mutants-list --pr "$PR_NUMBER" \
            --head-repo "$HEAD_REPO" --head-ref "$HEAD_REF" --github-output "$GITHUB_OUTPUT"
      # ADR-0109 section 3, from the number of mutants of this run, unless
      # the input gives it; the gate with its measured t. No mutant, or a
      # reused earlier run (#318): no shard.
      - name: Number of shards
        id: shards
        env:
          SHARDS_INPUT: ${{ inputs.shards }}
          MODE: ${{ steps.list.outputs.mode }}
          REUSE_RUN: ${{ steps.reuse.outputs.run }}
        run: |
          total=$(wc -l < mutants-list/all.txt)
          if [ "$total" -eq 0 ]; then
            if [ "$MODE" != gate ]; then
              echo "::error title=Mutation test::no mutant in the run"
              exit 1
            fi
            n=0
          elif [ -n "$REUSE_RUN" ]; then
            n=0
          elif [ -n "$SHARDS_INPUT" ]; then
            n="$SHARDS_INPUT"
            if ! [[ "$n" =~ ^[0-9]+$ ]] || [ "$n" -lt 1 ] || [ "$n" -gt 20 ]; then
              echo "::error title=Mutation test::shards must be 1-20, got '$n'"
              exit 1
            fi
          elif [ "$MODE" = gate ]; then
            n=$(python3 scripts/ci/mutants_target.py shards --mutants "$total" --seconds-per-mutant "$MUTANTS_GATE_SECONDS_PER_MUTANT")
          else
            n=$(python3 scripts/ci/mutants_target.py shards --mutants "$total")
          fi
          if [ "$n" -gt "$total" ]; then n="$total"; fi
          echo "shards=$n" >> "$GITHUB_OUTPUT"
          # No shard: the shard job is skipped by its `if`; its matrix still
          # gets one value, since an empty matrix is an error of its own.
          echo "matrix=$(python3 -c "import json,sys; n=int(sys.argv[1]); print(json.dumps(list(range(n)) or [0]))" "$n")" >> "$GITHUB_OUTPUT"
          echo "MUTANTS_SHARDS=$n" >> "$GITHUB_ENV"
      # The mutants of every shard, as the summary job expects them: a shard
      # that never uploads its outcomes still shows its untested mutants.
      - name: Mutants of the run, per shard
        env:
          CARGO_TERM_COLOR: never
          MODE: ${{ steps.list.outputs.mode }}
          REUSE_RUN: ${{ steps.reuse.outputs.run }}
          REUSE_SHA: ${{ steps.reuse.outputs.sha }}
          REUSE_KEY: ${{ steps.reuse.outputs.key }}
        run: |
          export PATH="$HOME/mutants-tools/bin:$PATH"
          mapfile -t filter < mutants-list/filter.txt
          for k in $(seq 0 $(( MUTANTS_SHARDS - 1 ))); do
            cargo mutants --list "${filter[@]}" --shard "$k/$MUTANTS_SHARDS" > "mutants-list/shard-$k.txt"
          done
          total=$(wc -l < mutants-list/all.txt)
          # || :, case (c): with no shard (the gate has nothing to test, or
          # reuses an earlier run) there is no shard file and cat fails; the
          # count is checked just below.
          sharded=$( (cat mutants-list/shard-*.txt 2>/dev/null || :) | wc -l)
          echo "::notice title=Mutants in scope::$total in $MUTANTS_SHARDS shards"
          if [ -n "$REUSE_RUN" ]; then
            if [ "$sharded" -ne 0 ]; then
              echo "::error title=Mutants in scope::reused run $REUSE_RUN, but the shard lists hold $sharded mutants"
              exit 1
            fi
          elif [ "$total" -ne "$sharded" ]; then
            echo "::error title=Mutants in scope::the shard lists hold $sharded mutants, the full list $total"
            exit 1
          fi
          {
            if [ -n "$REUSE_RUN" ]; then
              echo "### Pull-request gate: $total mutants on the changed lines, reused: run $REUSE_RUN (SHA $REUSE_SHA), key $REUSE_KEY"
              echo
              cat mutants-list/note.txt
            elif [ "$MODE" = gate ]; then
              echo "### Pull-request gate: $total mutants on the changed lines, $MUTANTS_SHARDS shards"
              echo
              cat mutants-list/note.txt
            elif [ -n "$MUTANTS_RE" ]; then
              echo "### Targeted run: $total mutants match \`$MUTANTS_RE\`, $MUTANTS_SHARDS shards"
            else
              echo "### Mutants in scope: $total, $MUTANTS_SHARDS shards"
            fi
            echo
            if [ "$total" -gt 0 ]; then
              echo '| Mutants | File |'
              echo '|---:|---|'
              cut -d: -f1 mutants-list/all.txt | sort | uniq -c | sort -rn | awk '{ print "| " $1 " | `" $2 "` |" }'
              echo
            fi
            if [ "$MUTANTS_SHARDS" -gt 0 ]; then
              echo '| Shard | Mutants |'
              echo '|---:|---:|'
              for k in $(seq 0 $(( MUTANTS_SHARDS - 1 ))); do
                echo "| $k | $(wc -l < "mutants-list/shard-$k.txt") |"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the mutant lists
        uses: actions/upload-artifact@v7
        with:
          name: mutants-list
          path: mutants-list/
          if-no-files-found: error

  mutants:
    name: Mutation test, shard ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: tools
    # The gate with no mutant to test has no shard.
    if: ${{ needs.tools.outputs.shards != '0' }}
    runs-on: ubuntu-24.04
    # Below GitHub's 6-hour job limit. cargo mutants itself stops at 300
    # minutes (below), so the outcomes so far are uploaded and the job ends
    # before this limit; "Upload mutants.out" runs with always() even if the
    # limit is reached. A shard is planned for under 4 hours (ADR-0109 §3).
    timeout-minutes: 330
    # ADR-0107: a missing tool fails a test instead of skipping it; here it
    # fails the baseline, so a mutant is never "caught" by a missing tool.
    # The differential test runs with the seed and count of the CI tool job.
    env:
      VOLT_REQUIRE_TOOLS: all
      VOLT_DIFFTEST_SEED: "20261104"
      VOLT_DIFFTEST_COUNT: "2000"
      MUTANTS_SHARDS: ${{ needs.tools.outputs.shards }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.tools.outputs.matrix) }}
    steps:
      - name: The matrix has MUTANTS_SHARDS shards
        run: |
          if [ "${{ strategy.job-total }}" -ne "$MUTANTS_SHARDS" ]; then
            echo "::error title=Mutation test::the matrix has ${{ strategy.job-total }} shards, MUTANTS_SHARDS is $MUTANTS_SHARDS"
            exit 1
          fi
      - uses: actions/checkout@v7
      # The filter of the run (empty for a full run) and its diff.
      - uses: actions/download-artifact@v8
        with:
          name: mutants-list
          path: mutants-list
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutants
          # Restored from main (cache-warm), never saved: the gate does not
          # run on main.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          env-vars: ImageOS
      - name: Restore cargo-mutants and cargo-nextest
        uses: actions/cache/restore@v6
        with:
          path: ~/mutants-tools
          key: mutants-tools-${{ runner.os }}-${{ env.CARGO_MUTANTS_VERSION }}-${{ env.CARGO_NEXTEST_VERSION }}
          fail-on-cache-miss: true
      - name: Put the tools on PATH
        run: |
          echo "$HOME/mutants-tools/bin" >> "$GITHUB_PATH"
          # Called directly, a cargo subcommand binary takes its own name first.
          "$HOME/mutants-tools/bin/cargo-mutants" mutants --version
          "$HOME/mutants-tools/bin/cargo-nextest" nextest --version
      # Same tools as the CI tool job ("Verilator lint"): Yosys, sby and the
      # solvers from the pinned OSS CAD Suite, Verilator pinned on its own.
      - name: Cache OSS CAD Suite
        id: oss-cad-cache
        uses: actions/cache@v6
        with:
          path: ~/oss-cad-suite
          key: oss-cad-suite-linux-x64-${{ env.OSS_CAD_SUITE_DATE }}
      - name: Download OSS CAD Suite (yosys, sby + solvers), with retries
        if: steps.oss-cad-cache.outputs.cache-hit != 'true'
        run: |
          stamp="${OSS_CAD_SUITE_DATE//-/}"
          url="https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSS_CAD_SUITE_DATE}/oss-cad-suite-linux-x64-${stamp}.tgz"
          curl -fL --retry 5 --retry-all-errors --retry-delay 20 -o /tmp/oss-cad-suite.tgz "$url"
          tar -xzf /tmp/oss-cad-suite.tgz -C "$HOME"
          rm /tmp/oss-cad-suite.tgz
      - name: Put OSS CAD Suite on PATH (Yosys, sby)
        run: |
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"
          "$HOME/oss-cad-suite/bin/yosys" -V
      # Verilator is the pinned release, not the Suite's development build
      # (#145); the action fails the job on any other `verilator --version`.
      - name: Pinned Verilator (scripts/ci/verilator.env)
        uses: ./.github/actions/verilator
      - name: Mutants of this shard
        env:
          CARGO_TERM_COLOR: never
        run: |
          mapfile -t filter < mutants-list/filter.txt
          cargo mutants --list "${filter[@]}" --shard ${{ matrix.shard }}/$MUTANTS_SHARDS > mutants-shard.txt
          if ! cmp -s mutants-shard.txt "mutants-list/shard-${{ matrix.shard }}.txt"; then
            echo "::error title=Mutation shard ${{ matrix.shard }}/$MUTANTS_SHARDS::the mutants differ from the list of the first job"
            # || true, case (b): diff only shows the difference; the step exits 1 on the next line.
            diff mutants-shard.txt "mutants-list/shard-${{ matrix.shard }}.txt" || true
            exit 1
          fi
          echo "::notice title=Mutation shard ${{ matrix.shard }}/$MUTANTS_SHARDS::$(wc -l < mutants-shard.txt) mutants"
      # #318: the inert paths (scripts/ci/mutants_inert.txt) leave the
      # checkout before the baseline. Every outcome of this shard is then
      # computed without them, which is what lets the reuse key leave them
      # out; a test that reads one fails this baseline, in every gate run.
      - name: Remove the inert paths (reuse key, #318)
        run: python3 scripts/ci/mutants_reuse.py mask
      # ADR-0128 (#366): the order of the baseline and of every mutant's
      # tests. `priority`: the profile `mutants` of .config/nextest.toml,
      # with the test binaries of this run's changed files first
      # (mutants-list/changed.txt; none for a full or targeted run), and a
      # check that every binary the profile names exists. `default`:
      # nextest's own order, as before ADR-0128. The baseline below runs in
      # the same order as the mutants.
      - name: Test order (nextest profile mutants, ADR-0128)
        env:
          CARGO_TERM_COLOR: never
        run: |
          case "$MUTANTS_NEXTEST_ORDER" in
            priority)
              python3 scripts/ci/mutants_nextest.py pr --changed mutants-list/changed.txt
              python3 scripts/ci/mutants_nextest.py check
              echo "NEXTEST_PROFILE=mutants" >> "$GITHUB_ENV"
              echo "::notice title=Mutation shard ${{ matrix.shard }}/$MUTANTS_SHARDS test order::nextest profile mutants (pull request's binaries first, slow binaries last)"
              ;;
            default)
              echo "::notice title=Mutation shard ${{ matrix.shard }}/$MUTANTS_SHARDS test order::nextest's default order (nextest_order=default)"
              ;;
            *)
              echo "::error title=Mutation shard ${{ matrix.shard }}/$MUTANTS_SHARDS::nextest_order must be priority or default, got '$MUTANTS_NEXTEST_ORDER'"
              exit 1
              ;;
          esac
      # The baseline: the unmutated tree runs every workspace test, with
      # every tool required, exactly as each mutant will, under the same
      # memory watchdog (a test that needs more fails here, not as a
      # "caught" mutant). cargo-mutants' own baseline tests the mutated
      # packages alone (ADR-0109 §1), so it is skipped below and the test
      # timeout comes from this measurement: twice the baseline, at least
      # 300 seconds. The watchdog records the peak memory of the build and
      # of the tests (--peak); the summary shows both per shard and warns
      # above half of the limit (#253): a mutant over the limit counts as
      # caught, so a baseline near it can hide a blind spot.
      # Incremental builds on (rust-cache turns them off): the mutated crate is
      # rebuilt for every mutant. Same value in both steps, or the mutants
      # would rebuild everything once.
      - name: Baseline - every workspace test, every tool required
        id: baseline
        env:
          CARGO_INCREMENTAL: "1"
        run: |
          python3 scripts/ci/mutants_watchdog.py run --limit-mib "$MUTANTS_MEMORY_LIMIT_MIB" --log baseline-memory-kills.tsv \
              --peak baseline-build-peak.txt -- \
            cargo nextest run --workspace --no-run
          start=$(date +%s)
          python3 scripts/ci/mutants_watchdog.py run --limit-mib "$MUTANTS_MEMORY_LIMIT_MIB" --log baseline-memory-kills.tsv \
              --peak baseline-test-peak.txt -- \
            cargo nextest run --workspace -E 'not test(new_test_verify_and_run_through_docker)'
          secs=$(( $(date +%s) - start ))
          limit=$(( secs * 2 ))
          if [ "$limit" -lt 300 ]; then limit=300; fi
          echo "timeout=$limit" >> "$GITHUB_OUTPUT"
          echo "::notice title=Mutation shard ${{ matrix.shard }}/$MUTANTS_SHARDS baseline::${secs} s; test timeout per mutant ${limit} s"
          # #318: the stamp a later run checks before it reuses this one:
          # rustc, cargo-mutants, cargo-nextest, Verilator and Yosys, the
          # runner image, and that the inert paths were absent. Written once
          # the baseline passed.
          python3 scripts/ci/mutants_reuse.py stamp --out stamp.json --baseline-seconds "$secs" --timeout "$limit"
      # --in-place reuses the target directory the baseline built instead of
      # copying the tree; the source file is restored after each mutant.
      # Exit codes of cargo mutants: 0 every mutant caught, 2 some missed,
      # 3 some timed out: the run is complete either way. 124: the
      # 300-minute stop (timeout) interrupted it. cargo-mutants writes each
      # outcome as it comes, so an interrupted shard keeps what it reached.
      # The watchdog (#160) passes cargo mutants' exit code through; each
      # process it kills is a line of memory-kills.tsv with its mutant.
      - name: cargo mutants --shard ${{ matrix.shard }}/${{ strategy.job-total }} (every tool required)
        env:
          CARGO_INCREMENTAL: "1"
        run: |
          mapfile -t filter < mutants-list/filter.txt
          # set +e, case (a): the exit code is captured below and checked by the case statement.
          set +e
          timeout --signal=INT --kill-after=5m 300m \
            python3 scripts/ci/mutants_watchdog.py run --limit-mib "$MUTANTS_MEMORY_LIMIT_MIB" \
              --log memory-kills.tsv --mutants-out mutants.out -- \
            cargo mutants --in-place "${filter[@]}" --shard ${{ matrix.shard }}/$MUTANTS_SHARDS \
              --baseline skip --timeout ${{ steps.baseline.outputs.timeout }} --build-timeout 1200
          code=$?
          set -e
          if [ -s memory-kills.tsv ]; then
            echo "::warning title=Mutation shard ${{ matrix.shard }}/$MUTANTS_SHARDS::$(wc -l < memory-kills.tsv) process(es) killed at the memory limit; their mutants are reported as memory limit (caught)"
          fi
          case "$code" in
            0|2|3) echo "::notice title=Mutation shard ${{ matrix.shard }}/$MUTANTS_SHARDS::cargo mutants finished, exit code $code" ;;
            124) echo "::error title=Mutation shard ${{ matrix.shard }}/$MUTANTS_SHARDS::not completed: stopped after 300 minutes; the outcomes so far are in the artifact"; exit 1 ;;
            *) echo "::error title=Mutation shard ${{ matrix.shard }}/$MUTANTS_SHARDS::not completed: cargo mutants exit code $code"; exit 1 ;;
          esac
      # #318: the shard's tool ledger goes into its artifact; a later run
      # that reuses this one checks it again (SKIP: 0, --min-ran 60).
      - name: Keep the tool ledger in the artifact (#318)
        if: always()
        run: |
          if [ -f "$VOLT_TOOL_LEDGER" ]; then
            cp "$VOLT_TOOL_LEDGER" tool-ledger.tsv
          else
            echo "No tool ledger: no test asked for a tool in this shard."
          fi
      # always(): also when a step failed, the job was cancelled or reached
      # its time limit, so the outcomes reached so far are kept.
      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-out-${{ matrix.shard }}
          path: |
            mutants.out/
            mutants-shard.txt
            memory-kills.tsv
            baseline-memory-kills.tsv
            baseline-build-peak.txt
            baseline-test-peak.txt
            stamp.json
            tool-ledger.tsv
          if-no-files-found: warn
      # ADR-0107: the baseline and every mutant ran their tool tests.
      - name: Tool ledger - SKIP count
        if: always()
        run: python3 scripts/ci/tool_ledger.py report "$VOLT_TOOL_LEDGER" --job "mutants-${{ matrix.shard }}" --require-zero-skips --min-ran 60

  summary:
    name: Mutation test summary
    needs: [tools, mutants]
    # Also after a failed or stopped shard (the summary names it) and when
    # the gate has no shard (the summary says why).
    if: ${{ !cancelled() && needs.tools.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      MUTANTS_SHARDS: ${{ needs.tools.outputs.shards }}
      MUTANTS_MODE: ${{ needs.tools.outputs.mode }}
      REUSE_RUN: ${{ needs.tools.outputs.reuse_run }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mutants-list
          path: lists
      # With one shard the one artifact lands in shards/ itself (#179); the
      # script reads both layouts.
      - uses: actions/download-artifact@v8
        if: ${{ needs.tools.outputs.shards != '0' }}
        with:
          pattern: mutants-out-*
          path: shards
      - name: Script self-test
        run: python3 scripts/ci/mutants_summary.py --self-test
      # A shard with no artifact, or with fewer outcomes than mutants, is
      # marked NOT COMPLETED at the top of the summary with its untested
      # mutants, and fails this step. The gate also fails on every missed
      # mutant that no exclude_re entry covers. A baseline peak above half of
      # the watchdog's limit is a warning, never a failure (#253). A reused
      # earlier run (#318): the verdict from its outcomes, checked again
      # here, with today's exclude_re; the summary names the run.
      - name: Merge the shards into the job summary
        run: |
          if [ -n "$REUSE_RUN" ]; then
            python3 scripts/ci/mutants_summary.py --reused lists/reuse --lists lists --gate --config .cargo/mutants.toml \
              --out merged --markdown "$GITHUB_STEP_SUMMARY" --memory-limit-mib "$MUTANTS_MEMORY_LIMIT_MIB"
            exit 0
          fi
          args=(shards --lists lists --shards "$MUTANTS_SHARDS" --out merged --markdown "$GITHUB_STEP_SUMMARY"
            --memory-limit-mib "$MUTANTS_MEMORY_LIMIT_MIB")
          if [ "$MUTANTS_MODE" = gate ]; then args+=(--gate --config .cargo/mutants.toml); fi
          if [ -s lists/note.txt ]; then args+=(--note "$(cat lists/note.txt)"); fi
          python3 scripts/ci/mutants_summary.py "${args[@]}"
      - name: Upload the merged lists
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-summary
          path: merged/
          if-no-files-found: warn
