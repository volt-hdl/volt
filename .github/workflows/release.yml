name: Release

# ADR-0093: prebuilt binaries. A release tag builds every archive and opens
# a DRAFT GitHub Release (a maintainer publishes it by hand). Never runs on
# pull requests.
#
# Dry run (ADR-0105): every run that is not the push of a release tag, that
# is workflow_dispatch from any branch (`gh workflow run release.yml --ref
# <branch>`). It runs every job that builds or checks: the archives, the
# smoke test on each platform, the install scripts against these archives,
# SHA256SUMS and its check, the release notes. Its results are workflow
# artifacts and nothing else. The two publishing steps, the provenance
# attestation (Sigstore's public transparency log and the repository's
# attestation store) and the draft Release, are in the `publish` job, which
# runs only when DRY_RUN is 'false'. `publish` is the one job that asks for
# a write permission; in a dry run no job holds one.
#
# A release tag is exactly vX.Y.Z (ADR-0100). GitHub matches the filter
# against the whole tag name ('+' repeats the character class, '.' is a
# literal dot), so v0.1.0 and v10.20.30 start a run, while a pre-release or
# suffixed tag (v0.1.0-rc1, the phase tags v0.1.0-f1), a prefixed tag
# (release-v0.1.0) and v0.1 or v0.1.0.1 do not. book.yml uses the same
# filter; scripts/check-consistency.* (check 18) holds both to it and tests
# the filter on these names. The version job below rejects any other tag
# name again, in case the filter is widened.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # 'true' unless this run is the push of a release tag. The `publish` job
  # (attestation + draft Release) runs only when it is 'false'.
  DRY_RUN: ${{ !(github.event_name == 'push' && github.ref_type == 'tag') }}
  # Windows: link the C runtime statically, so volt.exe runs on a machine
  # without the Visual C++ Redistributable (no VCRUNTIME140.dll import).
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static

jobs:
  version:
    name: Version check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
      # One number everywhere: Cargo workspace version = volt --version (a
      # cli_tests test pins that) = VS Code extension version = tag.
      - name: Read and compare versions
        id: v
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "volt-driver") | .version')
          ext=$(jq -r .version editors/vscode/package.json)
          echo "Cargo: $version, VS Code extension: $ext, ref: $GITHUB_REF_TYPE $GITHUB_REF_NAME"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not a release tag: a release tag is exactly vX.Y.Z (ADR-0100)"
            exit 1
          fi
          if [ "$ext" != "$version" ]; then
            echo "::error::editors/vscode/package.json version $ext != Cargo version $version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo version v$version (Cargo.toml [workspace.package])"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = true ]; then
            echo "::notice::Dry run of Volt $version from $GITHUB_REF_NAME ($GITHUB_SHA): no attestation, no GitHub Release, workflow artifacts only"
          else
            echo "::notice::Release run of Volt $version from tag $GITHUB_REF_NAME: attestation and draft GitHub Release at the end"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
            archive: zip
          # musl: a fully static binary, independent of the distribution's
          # glibc version (smoke-tested again inside CentOS 7, glibc 2.17).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            exe: ""
            archive: tar.gz
          # Two native macOS builds instead of one universal binary: each
          # archive is smoke-tested on its own architecture.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            exe: ""
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: ""
            archive: tar.gz
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      EXE: ${{ matrix.exe }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # No build cache on purpose: a release archive is built from the
      # tagged source alone, never from a cache another branch wrote.
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build (dist profile)
        run: cargo build --profile dist --locked -p volt-driver --bin volt --target "$TARGET"

      # Version-free archive names (volt-<target>.zip / .tar.gz), so
      # releases/latest/download/<name> always serves the newest release
      # (ADR-0096). The same script packages the archive install.yml tests.
      - name: Package archive
        id: pkg
        run: |
          path=$(bash scripts/release/package.sh "$TARGET" "target/$TARGET/dist/volt$EXE" "$VERSION" dist | tail -n 1)
          archive=$(basename "$path")
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          bin_size=$(wc -c < "target/$TARGET/dist/volt$EXE" | tr -d " ")
          arc_size=$(wc -c < "dist/$archive" | tr -d " ")
          echo "| $TARGET | $bin_size | $arc_size |" > "dist/size-$TARGET.md"
          echo "$archive: binary $bin_size bytes, archive $arc_size bytes"

      # Smoke test with the binary unpacked from the archive, in an empty
      # directory outside the repository, with cargo/rustup removed from PATH.
      - name: Smoke test (unpacked archive, empty directory)
        run: |
          # cygpath exists only on Windows runners; elsewhere RUNNER_TEMP is already a POSIX path.
          temp=$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")
          smoke="$temp/smoke"
          rm -rf "$smoke" && mkdir -p "$smoke/unpack" "$smoke/empty"
          archive="$PWD/dist/${{ steps.pkg.outputs.archive }}"
          cd "$smoke/unpack"
          if [ "${{ matrix.archive }}" = "zip" ]; then 7z x -bso0 "$archive"; else tar -xzf "$archive"; fi
          bin="$smoke/unpack/volt-$TARGET/volt$EXE"
          # ADR-0104: the binary names the commit it was built from.
          commit=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD | cut -c1-7)
          PATH=$(echo "$PATH" | tr ":" "\n" | grep -v -e cargo -e rustup | paste -sd: -)
          export PATH
          if command -v cargo; then echo "::error::cargo still on PATH"; exit 1; fi
          line=$("$bin" --version | tr -d "\r")
          echo "Smoke test $TARGET: $line"
          test "$line" = "volt $VERSION ($commit)"
          set -x
          cd "$smoke/empty"
          "$bin" new demo
          cd demo
          "$bin" check counter.volt
          "$bin" build counter.volt
          test -s build/rtl/Counter.sv
          "$bin" doctor

      - name: Portability - no VC++ runtime import (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin /nologo /dependents "target/$env:TARGET/dist/volt.exe" | Where-Object { $_ -match '\.dll' } | ForEach-Object { $_.Trim() }
          $deps
          $bad = $deps | Where-Object { $_ -match '^(vcruntime|msvcp|api-ms-win-crt)' }
          if ($bad) { Write-Error "C runtime DLL imports: $bad"; exit 1 }

      - name: Portability - static binary, runs on CentOS 7 (glibc 2.17)
        if: runner.os == 'Linux'
        run: |
          bin="target/$TARGET/dist/volt"
          file "$bin"
          file "$bin" | grep -qE "statically linked|static-pie linked"
          docker run --rm -v "$PWD/$(dirname "$bin"):/v:ro" centos:7 sh -euxc \
            "cat /etc/centos-release; ldd --version | head -1; /v/volt --version; cd /tmp; /v/volt new demo; cd demo; /v/volt check counter.volt; /v/volt build counter.volt; test -s build/rtl/Counter.sv; /v/volt doctor"

      - name: Portability - architecture and minimum macOS
        if: runner.os == 'macOS'
        run: |
          bin="target/$TARGET/dist/volt"
          file "$bin"
          lipo -archs "$bin"
          otool -L "$bin"
          # arm64 carries LC_BUILD_VERSION (minos), x86_64 (10.12) LC_VERSION_MIN_MACOSX.
          otool -l "$bin" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX"

      - uses: actions/upload-artifact@v7
        with:
          name: volt-${{ matrix.target }}
          path: |
            dist/${{ steps.pkg.outputs.archive }}
            dist/size-${{ matrix.target }}.md
          if-no-files-found: error

  # The install scripts against the archives this run built (dist profile),
  # on all four platforms: the VOLT_ARCHIVE path of install.yml, whose
  # tests take an archive. Install, a new shell finds volt, install again
  # (update), uninstall leaves nothing behind, a wrong SHA256SUMS installs
  # nothing.
  install:
    name: Install scripts ${{ matrix.target }}
    needs: [version, build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            shells: bash sh
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            shells: zsh bash
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            shells: zsh bash
    env:
      ARCHIVE: dist/volt-${{ matrix.target }}.${{ matrix.archive }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: volt-${{ matrix.target }}
          path: dist
      - name: install.sh (install, new shell, update, uninstall, wrong checksum)
        if: runner.os != 'Windows'
        run: sh scripts/install/test/test-install.sh "$ARCHIVE" ${{ matrix.shells }}
      - name: install.ps1 in PowerShell 7 (pwsh)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install/test/test-install.ps1 -Archive $env:ARCHIVE -Shell pwsh
      - name: install.ps1 in Windows PowerShell 5.1 (powershell.exe)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/install/test/test-install.ps1 -Archive $env:ARCHIVE -Shell powershell

  vsix:
    name: VS Code extension (.vsix)
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # vscode:prepublish compiles TypeScript; the language server is not
      # bundled, the extension starts `volt lsp` (setting volt.serverPath).
      - name: Package
        run: |
          mkdir -p ../../dist
          npx vsce package -o "../../dist/volt-hdl-$VERSION.vsix"
      - name: Check contents
        run: |
          vsix="../../dist/volt-hdl-$VERSION.vsix"
          unzip -l "$vsix" > list.txt
          for f in extension/package.json extension/out/extension.js extension/LICENSE.txt \
                   extension/syntaxes/volt.tmLanguage.json \
                   extension/node_modules/vscode-languageclient/package.json; do
            grep -q " $f\$" list.txt || { echo "::error::$f missing from the .vsix"; exit 1; }
          done
          size=$(wc -c < "$vsix" | tr -d " ")
          echo "| VS Code extension | - | $size |" > "../../dist/size-vsix.md"
      - uses: actions/upload-artifact@v7
        with:
          name: volt-vsix
          path: |
            dist/volt-hdl-${{ needs.version.outputs.version }}.vsix
            dist/size-vsix.md
          if-no-files-found: error

  checksums:
    name: Checksums + release notes
    needs: [version, build, vsix]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: collected
          merge-multiple: true
      # The install scripts ship with every release too, so a
      # version-pinned install can use the script of that very release.
      - name: SHA256SUMS
        run: |
          mkdir dist
          mv collected/volt-* dist/
          cp scripts/install/install.sh scripts/install/install.ps1 dist/
          # The attached copies install this release, not the newest one.
          sed -i "s/^PINNED_VERSION=\"\"\$/PINNED_VERSION=\"$VERSION\"/" dist/install.sh
          sed -i "s/^\(    .pinnedVersion = \)''\$/\1'$VERSION'/" dist/install.ps1
          grep -qx "PINNED_VERSION=\"$VERSION\"" dist/install.sh
          grep -qx "    .pinnedVersion = '$VERSION'" dist/install.ps1
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          {
            echo "### Volt $VERSION release files"
            echo
            echo "| Target | Binary (bytes) | Archive (bytes) |"
            echo "|---|---|---|"
            cat ../collected/size-*.md
          } >> "$GITHUB_STEP_SUMMARY"
      # What a user runs: every file listed, every file present and intact.
      - name: Check SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -c SHA256SUMS
          for f in *; do
            [ "$f" = SHA256SUMS ] || grep -q "  $f\$" SHA256SUMS || { echo "::error::$f is not in SHA256SUMS"; exit 1; }
          done
      # The body of the Release: docs/release-notes/v<version>.md, checked
      # (Behavior changes section, banned words, size; ADR-0100, ADR-0105).
      - name: Release notes
        run: |
          mkdir notes
          python3 scripts/release/notes.py --build "$VERSION" notes/notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: volt-release-${{ needs.version.outputs.version }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: volt-release-notes-${{ needs.version.outputs.version }}
          path: notes/notes.md
          if-no-files-found: error

  # The publishing steps, and the one job with write permissions. A dry run
  # skips it as a whole (ADR-0105): its condition below is the switch.
  publish:
    name: Publish (attestation + draft GitHub Release)
    if: needs.version.outputs.dry_run == 'false'
    needs: [version, checksums, install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: volt-release-${{ needs.version.outputs.version }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: volt-release-notes-${{ needs.version.outputs.version }}
          path: notes
      # Sigstore-signed SLSA build provenance for every archive, the .vsix
      # and the install scripts: `gh attestation verify <file> -R
      # volt-hdl/volt`. Public: Sigstore's transparency log and the
      # repository's attestation store.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/volt-*
            dist/install.sh
            dist/install.ps1
      - name: Create draft release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --verify-tag \
            --title "Volt $VERSION" \
            --notes-file notes/notes.md

  # A dry run says what it left out, and shows that no Release and no tag
  # exist for this version (or what does exist, made by an earlier run).
  dry-run:
    name: Dry run - nothing published
    if: needs.version.outputs.dry_run == 'true'
    needs: [version, checksums, install]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Summary
        run: |
          release=$(gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" --json isDraft,createdAt \
            --jq '"exists (draft: \(.isDraft), created \(.createdAt))"' 2>/dev/null || echo "none")
          tags=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$VERSION" --jq 'map(.ref) | join(" ")')
          {
            echo "### Dry run of Volt $VERSION ($GITHUB_REF_NAME, ${GITHUB_SHA::7})"
            echo
            echo "Skipped: the publish job (provenance attestation, draft GitHub Release)."
            echo "Workflow artifacts: volt-<target> (4), volt-vsix, volt-release-$VERSION, volt-release-notes-$VERSION."
            echo
            echo "GitHub Release v$VERSION: $release. Tags matching v$VERSION: ${tags:-none}."
          } | tee -a "$GITHUB_STEP_SUMMARY"
