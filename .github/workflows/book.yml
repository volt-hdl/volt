name: Book

# The Volt book (book/, mdBook). On every push to main it is built and
# published to GitHub Pages (https://volt-hdl.github.io/volt/); on a pull
# request it is built and its code is checked, nothing is published.
# Publishing needs the repository setting Settings -> Pages -> Source:
# GitHub Actions. The site root also serves the install scripts
# (scripts/install/, ADR-0096): a change to them goes live with the next
# push to main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MDBOOK_VERSION: 0.5.4
  # Same pinned toolchain and cache key as ci.yml (ADR-0079).
  OSS_CAD_SUITE_DATE: 2026-09-21

jobs:
  examples:
    name: Book code examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache OSS CAD Suite
        id: oss-cad-cache
        uses: actions/cache@v6
        with:
          path: ~/oss-cad-suite
          key: oss-cad-suite-linux-x64-${{ env.OSS_CAD_SUITE_DATE }}
      - name: Download OSS CAD Suite (verilator), with retries
        if: steps.oss-cad-cache.outputs.cache-hit != 'true'
        run: |
          stamp="${OSS_CAD_SUITE_DATE//-/}"
          url="https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSS_CAD_SUITE_DATE}/oss-cad-suite-linux-x64-${stamp}.tgz"
          curl -fL --retry 5 --retry-all-errors --retry-delay 20 -o /tmp/oss-cad-suite.tgz "$url"
          tar -xzf /tmp/oss-cad-suite.tgz -C "$HOME"
          rm /tmp/oss-cad-suite.tgz
      - name: Put Verilator on PATH
        run: |
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"
          "$HOME/oss-cad-suite/bin/verilator" --version
      - name: Build volt
        run: cargo build -p volt-driver --bin volt
      # The checker's own tests: a block with a compile error, a wrong
      # should_fail code, a misspelt attribute, an unexpected warning and a
      # banned word must each be rejected (book/tools/selftest/).
      - name: Checker self-test
        run: python3 book/tools/check_book.py --volt target/debug/volt --self-test
      # Every ```volt block passes `volt check` (or fails with the code it
      # declares); every *_test.volt block runs in Verilator. Verilator is
      # installed above, so the Docker bridge must not be used.
      - name: Every volt block compiles, every test block runs
        env:
          VOLT_TOOL_BACKEND: local
        run: python3 book/tools/check_book.py --volt target/debug/volt --run-tests

  build:
    name: Build the book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mdBook ${{ env.MDBOOK_VERSION }}
        run: |
          mkdir -p "$HOME/.local/bin"
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 "$url" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: mdbook build (warnings are errors)
        run: |
          mdbook --version
          mdbook build book 2>&1 | tee mdbook.log
          if grep -q "WARN\|ERROR" mdbook.log; then
            echo "::error::mdbook reported warnings or errors (see the log above)"
            exit 1
          fi
      # The one-line install commands fetch these from the site root:
      # https://volt-hdl.github.io/volt/install.ps1 and install.sh.
      # scripts/check-consistency.* (check 13) holds the book and the README
      # to these names.
      - name: Install scripts at the site root
        run: |
          cp scripts/install/install.ps1 scripts/install/install.sh book/book/
          ls -l book/book/install.ps1 book/book/install.sh
      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: book/book

  deploy:
    name: Publish to GitHub Pages
    needs: [examples, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never cancel a deployment half-way; a newer push waits for it.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
