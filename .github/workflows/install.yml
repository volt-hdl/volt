name: Install scripts

# ADR-0096: the one-line installers (scripts/install/). On a pull request
# or push that touches them: lint both scripts, then on Windows, Linux and
# macOS build volt, package it exactly as release.yml does and run the
# scripts against that archive (VOLT_ARCHIVE): install, a new shell finds
# volt, install again (update), uninstall leaves no file and no PATH entry,
# a wrong SHA256SUMS installs nothing. Then the network tests against a
# fake GitHub (scripts/install/test/fake-github.py): no release, a missing
# asset, a download cut short, a rate-limited API, transient errors, no
# answer at all; in sh, PowerShell 7 and Windows PowerShell 5.1. No
# published release is needed.
# Weekly (and by hand): the real one-line commands from the book. While no
# release is published they must end with the "no release yet" notice;
# once there is one, they must install it.

on:
  pull_request:
    paths:
      - scripts/install/**
      - scripts/release/**
      - .github/workflows/install.yml
      - .github/workflows/release.yml
  push:
    branches: [main]
    paths:
      - scripts/install/**
      - scripts/release/**
      - .github/workflows/install.yml
      - .github/workflows/release.yml
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  shellcheck:
    name: shellcheck
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # --shell=sh: the scripts must stay POSIX sh (no bash features).
      - run: |
          shellcheck --version
          shellcheck --shell=sh scripts/install/install.sh scripts/install/test/test-install.sh \
            scripts/install/test/test-network.sh scripts/release/package.sh

  psscriptanalyzer:
    name: PSScriptAnalyzer
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          Import-Module PSScriptAnalyzer
          "PSScriptAnalyzer $((Get-Module PSScriptAnalyzer).Version)"
          $settings = 'scripts/install/PSScriptAnalyzerSettings.psd1'
          $found = foreach ($f in 'scripts/install/install.ps1', 'scripts/install/test/test-install.ps1',
                                  'scripts/install/test/test-network.ps1', 'scripts/install/test/test-explorer.ps1',
                                  $settings) {
            Invoke-ScriptAnalyzer -Path $f -Settings $settings
          }
          $found | Format-Table ScriptName, Line, RuleName, Message -AutoSize -Wrap
          if ($found) { Write-Error "$(@($found).Count) finding(s)"; exit 1 }
          # ASCII without a BOM: scripts/check-consistency.* (check 14, ci.yml).

  test:
    name: Install test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            # bash: ~/.bashrc; sh (dash): ~/.profile
            shells: bash sh
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            # zsh: ~/.zshrc; bash: ~/.bash_profile (login shells on macOS)
            shells: zsh bash
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: install-${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # A debug build is enough: the scripts handle the archive, not the
      # compiler. Packaged by the same script as a release archive.
      - name: Build and package
        run: |
          cargo build --locked -p volt-driver --bin volt --target "$TARGET"
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=.exe
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "volt-driver") | .version')
          bash scripts/release/package.sh "$TARGET" "target/$TARGET/debug/volt$exe" "$version" dist
          ls -l dist
      - name: install.sh (install, new shell, update, uninstall, wrong checksum)
        if: runner.os != 'Windows'
        run: sh scripts/install/test/test-install.sh "dist/volt-$TARGET.${{ matrix.archive }}" ${{ matrix.shells }}
      - name: install.sh network failures (fake GitHub)
        if: runner.os != 'Windows'
        run: sh scripts/install/test/test-network.sh "dist/volt-$TARGET.${{ matrix.archive }}"
      # The wget fallback, GNU and busybox: a PATH of links to everything in
      # /usr/bin and /bin except curl (and, for busybox, with wget -> busybox).
      - name: install.sh network failures without curl (GNU wget, busybox wget)
        if: runner.os == 'Linux'
        run: |
          command -v busybox >/dev/null || { sudo apt-get update && sudo apt-get install -y busybox; }
          for kind in gnu busybox; do
            d="$RUNNER_TEMP/nocurl-$kind"
            mkdir -p "$d"
            for f in /usr/bin/* /bin/*; do
              n=$(basename "$f")
              [ "$n" = curl ] || [ -e "$d/$n" ] || ln -s "$f" "$d/$n"
            done
            if [ "$kind" = busybox ]; then ln -sf "$(command -v busybox)" "$d/wget"; fi
            echo "::group::$kind wget"
            PATH="$d" sh scripts/install/test/test-network.sh "dist/volt-$TARGET.${{ matrix.archive }}"
            echo "::endgroup::"
          done
      - name: install.ps1 in PowerShell 7 (pwsh)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install/test/test-install.ps1 -Archive "dist/volt-$env:TARGET.zip" -Shell pwsh
      - name: install.ps1 in Windows PowerShell 5.1 (powershell.exe)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          ./scripts/install/test/test-install.ps1 -Archive "dist/volt-$env:TARGET.zip" -Shell powershell
      - name: install.ps1 network failures in PowerShell 7 (fake GitHub)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install/test/test-network.ps1 -Archive "dist/volt-$env:TARGET.zip" -Shell pwsh
      - name: install.ps1 network failures in Windows PowerShell 5.1 (fake GitHub)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/install/test/test-network.ps1 -Archive "dist/volt-$env:TARGET.zip" -Shell powershell
      # A process started by the Windows shell (explorer.exe) itself, as Win+R
      # does, finds volt after the install and not after the uninstall.
      - name: install.ps1 seen from Explorer in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/install/test/test-explorer.ps1 -Archive "dist/volt-$env:TARGET.zip" -Shell powershell
      - name: install.ps1 seen from Explorer in PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install/test/test-explorer.ps1 -Archive "dist/volt-$env:TARGET.zip" -Shell pwsh

  # The real commands from the book, against the scripts on GitHub Pages and
  # github.com. GitHub's "latest" ignores drafts and pre-releases. While no
  # normal release exists the commands must end with the short "no release
  # yet" notice (no error record, nothing installed); after the first
  # release the same job checks the real install, with no change here.
  live:
    name: One-line install (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Newest published release
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>err.txt); then
            echo "Newest published release: $tag"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 404' err.txt; then
            echo "::notice::No published release yet: the one-line commands must say so."
          else
            cat err.txt
            exit 1
          fi
      - name: curl ... | sh
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          # set +e: the expected exit 1 (no release yet) must reach `test`; set -e is restored below.
          set +e
          out=$(curl -fsSL https://volt-hdl.github.io/volt/install.sh | sh 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ -n "$VERSION" ]; then
            test "$code" -eq 0
            test "$("$HOME/.volt/bin/volt" --version)" = "volt $VERSION"
          else
            test "$code" -eq 1
            echo "$out" | grep -qF 'No Volt release has been published yet.'
            echo "$out" | grep -qF 'cargo install --locked --path crates/volt-driver'
            test ! -e "$HOME/.volt"
          fi
      - name: irm ... | iex (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          # Everything the installer prints, Write-Host included.
          $out = & { irm https://volt-hdl.github.io/volt/install.ps1 | iex } *>&1 | Out-String
          $out
          # Still here: the installer did not close the session.
          if ($env:VERSION) {
            $v = volt --version
            if ($v -ne "volt $env:VERSION") { Write-Error "got '$v', expected 'volt $env:VERSION'"; exit 1 }
          } else {
            if (-not $out.Contains('No Volt release has been published yet.')) { Write-Error 'no "no release yet" notice'; exit 1 }
            if ($out -match 'At line:|CategoryInfo|FullyQualifiedErrorId') { Write-Error 'a PowerShell error record was printed'; exit 1 }
            if (Test-Path "$env:LOCALAPPDATA\Programs\Volt") { Write-Error 'files were left in the install folder'; exit 1 }
          }
          # Every check above exits 1 on failure; without this the installer's $LASTEXITCODE becomes the step's exit code (ADR-0096).
          exit 0
