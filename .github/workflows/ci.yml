name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: BiÃ§im + Lint + Testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: BiÃ§im denetimi
        run: cargo fmt --all --check
      - name: Clippy (uyarÄ±lar hata)
        run: cargo clippy --all-targets -- -D warnings
      - name: Testler
        run: cargo test --all

  integration:
    name: Verilator lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verilator kur
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: counter.volt derle
        run: cargo run --bin volt -- build tests/fixtures/counter.volt
      # DECLFILENAME beklenen bir istisna: cli-contract.md Â§5 Ã§Ä±ktÄ± adÄ±nÄ±
      # kaynak dosyadan (counter.sv), sv-mapping.md Ä°1 modÃ¼l adÄ±nÄ± Volt
      # kaynaÄŸÄ±ndan (Counter) tÃ¼retir â€” bÃ¼yÃ¼k/kÃ¼Ã§Ã¼k harf farkÄ± kaÃ§Ä±nÄ±lmaz.
      # Onun dÄ±ÅŸÄ±nda SIFIR uyarÄ± bekleniyor.
      - name: Verilator lint â€” SIFIR uyarÄ± bekleniyor
        run: verilator --lint-only -Wall -Wno-DECLFILENAME build/rtl/counter.sv

  consistency:
    name: Spec-kod tutarlÄ±lÄ±k
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v2
      - name: TutarlÄ±lÄ±k denetimi
        run: just consistency

  verify:
    name: Formal doÄŸrulama (opsiyonel)
    runs-on: ubuntu-latest
    # Opsiyonel: harici araÃ§ zinciri (yosys + sby + z3) CI'yÄ± kÄ±rmamalÄ±;
    # lokal testlerde sby yoksa ilgili testler zaten SKIP eder.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: OSS CAD Suite kur (yosys + sby + Ã§Ã¶zÃ¼cÃ¼ler)
        uses: YosysHQ/setup-oss-cad-suite@v3
      - name: KanÄ±tlanabilir invariant â†’ Ã§Ä±kÄ±ÅŸ 0
        run: cargo run --bin volt -- verify tests/ui/pass/23_provable_invariant.volt
      - name: Ä°hlal edilen invariant â†’ Ã§Ä±kÄ±ÅŸ 6 + karÅŸÄ± Ã¶rnek
        run: |
          set +e
          cargo run --bin volt -- verify tests/ui/fail/24_violated_invariant.volt
          code=$?
          echo "volt verify Ã§Ä±kÄ±ÅŸ kodu: $code"
          test "$code" -eq 6

  coverage:
    name: Kapsam (bilgi amaÃ§lÄ±)
    runs-on: ubuntu-latest
    # Bilgi amaÃ§lÄ±: eÅŸik henÃ¼z yok, baÅŸarÄ±sÄ±zlÄ±k CI'yÄ± kÄ±rmaz.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: extractions/setup-just@v2
      - uses: Swatinem/rust-cache@v2
      - name: Kapsam raporu
        run: just coverage
      - name: HTML raporu yÃ¼kle
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: target/llvm-cov/html/

  fuzz:
    name: Fuzz (5 dk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - name: cargo-fuzz kur
        run: cargo install cargo-fuzz --locked
      - name: parse_never_panics (300 s)
        run: cargo +nightly fuzz run parse_never_panics -- -max_total_time=300
