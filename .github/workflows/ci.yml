name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format + Lint + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all

  integration:
    name: Verilator lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Compile counter.volt
        run: cargo run --bin volt -- build tests/fixtures/counter.volt
      # ADR-0024: the output file name derives from the module name
      # (build/rtl/Counter.sv), so ZERO warnings are expected, DECLFILENAME included.
      - name: Verilator lint - ZERO warnings expected
        run: verilator --lint-only -Wall build/rtl/Counter.sv
      # ADR-0064: contracts as simulation monitors (DPI callbacks), incl. the
      # beyond-formal-depth proof (tests/fixtures/sim_contracts/deep_violation.volt).
      - name: Simulation contract monitors (volt test, real Verilator)
        run: cargo test -p volt-driver --test sim_contract_tests
      # ADR-0076: extern bodies from @source reach Verilator (real-tool tests
      # skip only when the tool is missing; the step below fails instead).
      - name: Extern @source tests (real Verilator)
        run: cargo test -p volt-driver --test extern_source_tests
      - name: Extern @source simulation (volt test) -> exit 0
        run: cargo run --bin volt -- test tests/fixtures/extern_source/ext_top_test.volt
      # ADR-0078: keyword-safe names lint clean, C++-word ports simulate
      # through Verilator's __SYM__ names (real-tool tests skip only when
      # the tool is missing).
      - name: Reserved-word names (real Verilator)
        run: cargo test -p volt-driver --test reserved_name_tests
      # ADR-0079 output net: every generated SV and SVA (.sva + bind, inline)
      # through Verilator -Wall, every C header through cc/c++ -Werror, every
      # Rust driver through rustc -D warnings. The tools are installed in this
      # job, so a missing one FAILS instead of skipping.
      - name: Output net - Verilator, cc, c++, rustc (ADR-0079)
        env:
          VOLT_REQUIRE_TOOLS: verilator,cc,cxx,rustc
        run: cargo test -p volt-driver --test output_net_tests -- verilator cc_ cxx_ rustc_

  consistency:
    name: Spec-code consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v2
      - name: Consistency check
        run: just consistency

  verify:
    name: Formal verification
    runs-on: ubuntu-latest
    # REQUIRED: a real formal failure must break CI. Network flakiness is
    # handled by a pinned, cached toolchain and download retries instead of
    # continue-on-error (setup-oss-cad-suite always fetched the newest nightly
    # and failed PR #5 with HTTP 504 on the GitHub release download).
    env:
      OSS_CAD_SUITE_DATE: 2026-09-21
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache OSS CAD Suite
        id: oss-cad-cache
        uses: actions/cache@v6
        with:
          path: ~/oss-cad-suite
          key: oss-cad-suite-linux-x64-${{ env.OSS_CAD_SUITE_DATE }}
      - name: Download OSS CAD Suite (yosys + sby + solvers), with retries
        if: steps.oss-cad-cache.outputs.cache-hit != 'true'
        run: |
          stamp="${OSS_CAD_SUITE_DATE//-/}"
          url="https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSS_CAD_SUITE_DATE}/oss-cad-suite-linux-x64-${stamp}.tgz"
          curl -fL --retry 5 --retry-all-errors --retry-delay 20 -o /tmp/oss-cad-suite.tgz "$url"
          tar -xzf /tmp/oss-cad-suite.tgz -C "$HOME"
          rm /tmp/oss-cad-suite.tgz
      - name: Put OSS CAD Suite on PATH
        run: |
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"
          "$HOME/oss-cad-suite/bin/sby" --help > /dev/null
          "$HOME/oss-cad-suite/bin/yosys" -V
      - name: Provable invariant -> exit 0
        run: cargo run --bin volt -- verify tests/ui/pass/23_provable_invariant.volt
      - name: Violated invariant -> exit 6 + counterexample
        run: |
          set +e
          cargo run --bin volt -- verify tests/ui/fail/24_violated_invariant.volt
          code=$?
          echo "volt verify exit code: $code"
          test "$code" -eq 6
      # ADR-0064 proof: the violation happens at cycle 101, so a 20-step BMC
      # cannot see it (exit 0) while `volt test` fails (integration job).
      - name: Deep violation is invisible to BMC depth 20 -> exit 0
        run: cargo run --bin volt -- verify --mode bmc --depth 20 tests/fixtures/sim_contracts/deep_violation.volt
      # ADR-0066: an automatic FSM transition cover on a dead arm is
      # unreachable -> cover mode fails with E5001 (exit 6).
      - name: Unreachable auto FSM transition (cover mode) -> exit 6
        run: |
          set +e
          cargo run --bin volt -- verify --mode cover tests/ui/fail/71_auto_fsm_unreachable_transition.volt
          code=$?
          echo "volt verify exit code: $code"
          test "$code" -eq 6
      # ADR-0055: one sby process, one task per contract-bearing module, -j N.
      - name: SoC (145 properties, 8 module tasks) -j 4 -> exit 0
        run: cargo run --bin volt -- verify -j 4 --depth 12 examples/soc/top.volt
      # ADR-0076: the extern body from @source is read by sby; the invariant
      # is provable only with it.
      - name: Extern @source (bmc + prove) -> exit 0
        run: |
          cargo run --bin volt -- verify tests/fixtures/extern_source/ext_top.volt
          cargo run --bin volt -- verify --mode prove --depth 4 tests/fixtures/extern_source/ext_top.volt
      - name: Extern @source tests (real sby)
        run: cargo test -p volt-driver --test extern_source_tests
      # ADR-0079 output net: every generated SV elaborated by Yosys
      # (hierarchy -check, proc, check -assert), every .xdc evaluated by Tcl
      # against the Vivado command subset. Yosys is required here.
      - name: Output net - Yosys elaboration + XDC Tcl gate (ADR-0079)
        env:
          VOLT_REQUIRE_TOOLS: yosys
        run: cargo test -p volt-driver --test output_net_tests -- yosys

  timing:
    name: Timing constraints (OpenSTA second net)
    runs-on: ubuntu-latest
    # ADR-0065 stage 4: the generated .sdc must keep every unsynchronized
    # crossing and every wrong-clock reset VISIBLE to the timing tool
    # (scripts/sta/run.py). Yosys comes from the same pinned OSS CAD Suite as
    # the formal job; OpenSTA is a digest-pinned Docker image cached as a tar.
    env:
      OSS_CAD_SUITE_DATE: 2026-09-21
      OPENSTA_DIGEST: sha256:e04e5f38a0bc371557ae50de26fa16a5bbfae7cb7772be054ab9d61a38f7e99b
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache OSS CAD Suite
        id: oss-cad-cache
        uses: actions/cache@v6
        with:
          path: ~/oss-cad-suite
          key: oss-cad-suite-linux-x64-${{ env.OSS_CAD_SUITE_DATE }}
      - name: Download OSS CAD Suite (yosys), with retries
        if: steps.oss-cad-cache.outputs.cache-hit != 'true'
        run: |
          stamp="${OSS_CAD_SUITE_DATE//-/}"
          url="https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSS_CAD_SUITE_DATE}/oss-cad-suite-linux-x64-${stamp}.tgz"
          curl -fL --retry 5 --retry-all-errors --retry-delay 20 -o /tmp/oss-cad-suite.tgz "$url"
          tar -xzf /tmp/oss-cad-suite.tgz -C "$HOME"
          rm /tmp/oss-cad-suite.tgz
      - name: Put OSS CAD Suite on PATH
        run: |
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"
          "$HOME/oss-cad-suite/bin/yosys" -V
      - name: Cache OpenSTA image (3.1.0, digest-pinned)
        id: opensta-cache
        uses: actions/cache@v6
        with:
          path: ~/opensta-image.tar
          key: opensta-${{ env.OPENSTA_DIGEST }}
      - name: Pull OpenSTA image
        if: steps.opensta-cache.outputs.cache-hit != 'true'
        run: |
          docker pull "openroad/opensta@${OPENSTA_DIGEST}"
          docker tag "openroad/opensta@${OPENSTA_DIGEST}" opensta:pinned
          docker save -o "$HOME/opensta-image.tar" opensta:pinned
      - name: Load OpenSTA image
        if: steps.opensta-cache.outputs.cache-hit == 'true'
        run: docker load -i "$HOME/opensta-image.tar"
      - name: OpenSTA version
        run: docker run --rm --entrypoint /OpenSTA/build/sta opensta:pinned -exit /dev/null | head -1
      - name: Build volt
        run: cargo build --bin volt
      # 4.1 / 4.2: the injected crossing and wrong-clock reset are "No paths
      # found" with --sdc-style=clock-groups and VIOLATED / timed with the
      # targeted style. 4.3 / 4.4: every get_cells pattern names a cell, no
      # inter-clock violation, tns 0.00 on the clean design.
      - name: Second-net proof - tests/ui/pass/87 (every bridge kind, raw resets)
        env:
          VOLT_STA_STA: docker run --rm -v {work}:/work -w /work --entrypoint /OpenSTA/build/sta opensta:pinned
        run: python3 scripts/sta/run.py --probe --require-zero-tns
      - name: No false positives - examples/hybrid_accel (AsyncFifo, 400/200 MHz)
        env:
          VOLT_STA_STA: docker run --rm -v {work}:/work -w /work --entrypoint /OpenSTA/build/sta opensta:pinned
        run: python3 scripts/sta/run.py --design examples/hybrid_accel/hybrid_top.volt --top HybridTop
      # ADR-0079 output net: every .sdc the corpus produces (both styles)
      # read by OpenSTA -- no Error/Warning, every get_cells pattern names a cell.
      - name: Output net - every .sdc through OpenSTA read_sdc (ADR-0079)
        env:
          VOLT_STA_STA: docker run --rm -v {work}:/work -w /work --entrypoint /OpenSTA/build/sta opensta:pinned
        run: python3 scripts/sta/sweep.py
      - name: Upload OpenSTA reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opensta-reports
          path: |
            build/sta/*/summary.md
            build/sta/*/*.sta.log
            build/sta/*/*.yosys.log
            build/sta/*/*_named.v
            build/sta/*/*.sdc
            build/sta/sweep/summary.md

  coverage:
    name: Coverage (informational)
    runs-on: ubuntu-latest
    # Informational: no threshold yet, a failure does not break CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: extractions/setup-just@v2
      - uses: Swatinem/rust-cache@v2
      - name: Coverage report
        run: just coverage
      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: target/llvm-cov/html/

  fuzz:
    name: Fuzz (60 s)
    runs-on: ubuntu-latest
    # Short smoke run on every push/PR. The long run (30 min, corpus carried
    # over between nights) lives in fuzz-nightly.yml. The nightly corpus is
    # restored read-only here (caches saved on main are visible to PRs), so
    # the 60 s start from everything the nightly job has already found.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Restore nightly corpus (read-only)
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/parse_never_panics
          key: fuzz-corpus-parse_never_panics-${{ github.run_id }}
          restore-keys: fuzz-corpus-parse_never_panics-
      # First corpus dir receives new inputs; tests/ui and the fuzz regression
      # inputs (ADR-0067) are read-only seeds.
      - name: parse_never_panics (60 s)
        run: |
          mkdir -p fuzz/corpus/parse_never_panics
          cargo +nightly fuzz run parse_never_panics \
            "$GITHUB_WORKSPACE/fuzz/corpus/parse_never_panics" \
            "$GITHUB_WORKSPACE/tests/ui" \
            "$GITHUB_WORKSPACE/tests/fuzz_regressions" \
            -- -max_total_time=60
      - name: Upload crash input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-parse_never_panics
          path: fuzz/artifacts/parse_never_panics/
