name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # ADR-0107: every tool lookup of a test (tools::require, tools::opt_in)
  # appends a SKIP or RAN line here. Each job that runs tests reports the
  # count at its end; the tool-coverage job cross-checks the ledgers.
  # Outside the checkout: the tests leave the working tree clean.
  VOLT_TOOL_LEDGER: /tmp/volt-tool-ledger.tsv
  # ADR-0108: the differential test appends its report here (seed, count,
  # accepted expressions, differences); the tool job prints it.
  VOLT_DIFFTEST_SUMMARY: /tmp/volt-difftest.txt

jobs:
  test:
    name: Format + Lint + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all
      # ADR-0107: how many tests skipped for a missing tool, and which.
      - name: Tool ledger - SKIP count
        if: always()
        run: python3 scripts/ci/tool_ledger.py report "$VOLT_TOOL_LEDGER" --job test
      - name: Upload tool ledger
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tool-ledger-test
          path: ${{ env.VOLT_TOOL_LEDGER }}
          if-no-files-found: ignore
      # A test writes into a temporary directory, never into the checkout:
      # after the tests the working tree is exactly the commit.
      - name: Tests leave the working tree clean
        run: |
          dirty=$(git status --porcelain --untracked-files=all)
          if [ -n "$dirty" ]; then
            echo "::error::the tests changed or created files in the checkout"
            echo "$dirty"
            exit 1
          fi

  integration:
    # The name stays "Verilator lint" (a required status check); since
    # ADR-0107 this is THE tool job: every test with every tool required.
    name: Verilator lint
    runs-on: ubuntu-latest
    # ADR-0079: Yosys, sby and the solvers come from the same pinned, cached
    # OSS CAD Suite as the formal and timing jobs. The apt Verilator floated
    # with the runner image (5.020 on ubuntu-24.04) and cannot build valid SV
    # such as a delayed array reset loop longer than 64 (BLKLOOPINIT,
    # examples/riscv_sw/hello_soc.volt). The Suite's Verilator is a
    # development build that miscompiles correct SV (#145), so Verilator is
    # the release pinned in scripts/ci/verilator.env, copied out of the
    # Docker backend's image (ADR-0107, "Hakem sürümü").
    env:
      OSS_CAD_SUITE_DATE: 2026-09-21
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache OSS CAD Suite
        id: oss-cad-cache
        uses: actions/cache@v6
        with:
          path: ~/oss-cad-suite
          key: oss-cad-suite-linux-x64-${{ env.OSS_CAD_SUITE_DATE }}
      - name: Download OSS CAD Suite (yosys, sby + solvers), with retries
        if: steps.oss-cad-cache.outputs.cache-hit != 'true'
        run: |
          stamp="${OSS_CAD_SUITE_DATE//-/}"
          url="https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSS_CAD_SUITE_DATE}/oss-cad-suite-linux-x64-${stamp}.tgz"
          curl -fL --retry 5 --retry-all-errors --retry-delay 20 -o /tmp/oss-cad-suite.tgz "$url"
          tar -xzf /tmp/oss-cad-suite.tgz -C "$HOME"
          rm /tmp/oss-cad-suite.tgz
      - name: Put OSS CAD Suite on PATH (Yosys, sby)
        run: |
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"
          "$HOME/oss-cad-suite/bin/yosys" -V
      # Verilator is the pinned release, not the Suite's development build
      # (#145); the action fails the job on any other `verilator --version`.
      - name: Pinned Verilator (scripts/ci/verilator.env)
        uses: ./.github/actions/verilator
      - name: Compile counter.volt
        run: cargo run --bin volt -- build tests/fixtures/counter.volt
      # ADR-0024: the output file name derives from the module name
      # (build/rtl/Counter.sv), so ZERO warnings are expected, DECLFILENAME included.
      - name: Verilator lint - ZERO warnings expected
        run: verilator --lint-only -Wall build/rtl/Counter.sv
      - name: Extern @source simulation (volt test) -> exit 0
        run: cargo run --bin volt -- test tests/fixtures/extern_source/ext_top_test.volt
      # ADR-0107: EVERY test of the workspace runs here with EVERY tool
      # required. There is no list of test files: a new test that asks for a
      # tool (tools::require) runs in this step with its tool required and
      # fails, instead of skipping, when the tool is missing. The OSS CAD
      # Suite brings Yosys, sby and the solvers; the pinned image brings
      # Verilator; the runner brings cc, c++, make and docker; the toolchain
      # brings rustc. This replaces
      # the per-binary steps of ADR-0079 section 6 (the formal job's sby tests
      # included): a test missing from those lists never ran in CI (#111).
      # One exclusion, by name: docker_e2e_tests pulls ~650 MB of images and
      # hides the local tools; it runs in the docker-backend job with
      # VOLT_DOCKER_E2E=1 and zero skips required there.
      # ADR-0108: difftest_tests runs here too, with a fixed seed and count
      # (the large run is the "Differential test (large run)" workflow).
      - name: Every test, every tool required (ADR-0079, ADR-0107)
        env:
          VOLT_REQUIRE_TOOLS: all
          VOLT_DIFFTEST_SEED: "20261104"
          VOLT_DIFFTEST_COUNT: "2000"
        run: cargo test --workspace --no-fail-fast -- --skip new_test_verify_and_run_through_docker
      # ADR-0108: seed, count, accepted expressions and differences of the
      # differential test; fails when the test did not run or found one.
      - name: Differential test summary (ADR-0108)
        if: always()
        run: |
          python3 scripts/ci/difftest_summary.py --self-test
          python3 scripts/ci/difftest_summary.py "$VOLT_DIFFTEST_SUMMARY" --job integration
      # ADR-0107: how many tests skipped for a missing tool, and which.
      - name: Tool ledger - SKIP count
        if: always()
        run: python3 scripts/ci/tool_ledger.py report "$VOLT_TOOL_LEDGER" --job integration --require-zero-skips --min-ran 60
      - name: Upload tool ledger
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tool-ledger-integration
          path: ${{ env.VOLT_TOOL_LEDGER }}
          if-no-files-found: ignore
      # A test writes into a temporary directory, never into the checkout:
      # after the tests the working tree is exactly the commit.
      - name: Tests leave the working tree clean
        run: |
          dirty=$(git status --porcelain --untracked-files=all)
          if [ -n "$dirty" ]; then
            echo "::error::the tests changed or created files in the checkout"
            echo "$dirty"
            exit 1
          fi

  consistency:
    name: Spec-code consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v2
      - name: Consistency check
        run: just consistency

  verify:
    name: Formal verification
    runs-on: ubuntu-latest
    # REQUIRED: a real formal failure must break CI. Network flakiness is
    # handled by a pinned, cached toolchain and download retries instead of
    # continue-on-error (setup-oss-cad-suite always fetched the newest nightly
    # and failed PR #5 with HTTP 504 on the GitHub release download).
    # The `volt verify` command-line runs stay here; the cargo tests that need
    # sby or Yosys run in the integration job with every tool required
    # (ADR-0107), so this job runs no test binary and has no tool ledger.
    env:
      OSS_CAD_SUITE_DATE: 2026-09-21
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache OSS CAD Suite
        id: oss-cad-cache
        uses: actions/cache@v6
        with:
          path: ~/oss-cad-suite
          key: oss-cad-suite-linux-x64-${{ env.OSS_CAD_SUITE_DATE }}
      - name: Download OSS CAD Suite (yosys + sby + solvers), with retries
        if: steps.oss-cad-cache.outputs.cache-hit != 'true'
        run: |
          stamp="${OSS_CAD_SUITE_DATE//-/}"
          url="https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSS_CAD_SUITE_DATE}/oss-cad-suite-linux-x64-${stamp}.tgz"
          curl -fL --retry 5 --retry-all-errors --retry-delay 20 -o /tmp/oss-cad-suite.tgz "$url"
          tar -xzf /tmp/oss-cad-suite.tgz -C "$HOME"
          rm /tmp/oss-cad-suite.tgz
      - name: Put OSS CAD Suite on PATH
        run: |
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"
          "$HOME/oss-cad-suite/bin/sby" --help > /dev/null
          "$HOME/oss-cad-suite/bin/yosys" -V
      - name: Provable invariant -> exit 0
        run: cargo run --bin volt -- verify tests/ui/pass/23_provable_invariant.volt
      - name: Violated invariant -> exit 6 + counterexample
        run: |
          # set +e: the expected exit 6 must reach `test`, not abort the step.
          set +e
          cargo run --bin volt -- verify tests/ui/fail/24_violated_invariant.volt
          code=$?
          echo "volt verify exit code: $code"
          test "$code" -eq 6
      # ADR-0064 proof: the violation happens at cycle 101, so a 20-step BMC
      # cannot see it (exit 0) while `volt test` fails (integration job).
      - name: Deep violation is invisible to BMC depth 20 -> exit 0
        run: cargo run --bin volt -- verify --mode bmc --depth 20 tests/fixtures/sim_contracts/deep_violation.volt
      # ADR-0066: an automatic FSM transition cover on a dead arm is
      # unreachable -> cover mode fails with E5001 (exit 6).
      - name: Unreachable auto FSM transition (cover mode) -> exit 6
        run: |
          # set +e: the expected exit 6 must reach `test`, not abort the step.
          set +e
          cargo run --bin volt -- verify --mode cover tests/ui/fail/71_auto_fsm_unreachable_transition.volt
          code=$?
          echo "volt verify exit code: $code"
          test "$code" -eq 6
      # ADR-0055: one sby process, one task per module that checks something,
      # -j N. ADR-0097: each parent task also asserts the Handshake/requires
      # obligations of the instances below it.
      - name: SoC (154 properties, 8 module tasks) -j 4 -> exit 0
        run: cargo run --bin volt -- verify -j 4 --depth 12 examples/soc/top.volt
      # ADR-0076: the extern body from @source is read by sby; the invariant
      # is provable only with it.
      - name: Extern @source (bmc + prove) -> exit 0
        run: |
          cargo run --bin volt -- verify tests/fixtures/extern_source/ext_top.volt
          cargo run --bin volt -- verify --mode prove --depth 4 tests/fixtures/extern_source/ext_top.volt

  timing:
    name: Timing constraints (OpenSTA second net)
    runs-on: ubuntu-latest
    # ADR-0065 stage 4: the generated .sdc must keep every unsynchronized
    # crossing and every wrong-clock reset VISIBLE to the timing tool
    # (scripts/sta/run.py). Yosys comes from the same pinned OSS CAD Suite as
    # the formal job; OpenSTA is a digest-pinned Docker image cached as a tar.
    env:
      OSS_CAD_SUITE_DATE: 2026-09-21
      OPENSTA_DIGEST: sha256:e04e5f38a0bc371557ae50de26fa16a5bbfae7cb7772be054ab9d61a38f7e99b
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache OSS CAD Suite
        id: oss-cad-cache
        uses: actions/cache@v6
        with:
          path: ~/oss-cad-suite
          key: oss-cad-suite-linux-x64-${{ env.OSS_CAD_SUITE_DATE }}
      - name: Download OSS CAD Suite (yosys), with retries
        if: steps.oss-cad-cache.outputs.cache-hit != 'true'
        run: |
          stamp="${OSS_CAD_SUITE_DATE//-/}"
          url="https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSS_CAD_SUITE_DATE}/oss-cad-suite-linux-x64-${stamp}.tgz"
          curl -fL --retry 5 --retry-all-errors --retry-delay 20 -o /tmp/oss-cad-suite.tgz "$url"
          tar -xzf /tmp/oss-cad-suite.tgz -C "$HOME"
          rm /tmp/oss-cad-suite.tgz
      - name: Put OSS CAD Suite on PATH
        run: |
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"
          "$HOME/oss-cad-suite/bin/yosys" -V
      - name: Cache OpenSTA image (3.1.0, digest-pinned)
        id: opensta-cache
        uses: actions/cache@v6
        with:
          path: ~/opensta-image.tar
          key: opensta-${{ env.OPENSTA_DIGEST }}
      - name: Pull OpenSTA image
        if: steps.opensta-cache.outputs.cache-hit != 'true'
        run: |
          docker pull "openroad/opensta@${OPENSTA_DIGEST}"
          docker tag "openroad/opensta@${OPENSTA_DIGEST}" opensta:pinned
          docker save -o "$HOME/opensta-image.tar" opensta:pinned
      - name: Load OpenSTA image
        if: steps.opensta-cache.outputs.cache-hit == 'true'
        run: docker load -i "$HOME/opensta-image.tar"
      - name: OpenSTA version
        run: docker run --rm --entrypoint /OpenSTA/build/sta opensta:pinned -exit /dev/null | head -1
      - name: Build volt
        run: cargo build --bin volt
      # 4.1 / 4.2: the injected crossing and wrong-clock reset are "No paths
      # found" with --sdc-style=clock-groups and VIOLATED / timed with the
      # targeted style. 4.3 / 4.4: every get_cells pattern names a cell, no
      # inter-clock violation, tns 0.00 on the clean design.
      - name: Second-net proof - tests/ui/pass/87 (every bridge kind, raw resets)
        env:
          VOLT_STA_STA: docker run --rm -v {work}:/work -w /work --entrypoint /OpenSTA/build/sta opensta:pinned
        run: python3 scripts/sta/run.py --probe --require-zero-tns
      - name: No false positives - examples/hybrid_accel (AsyncFifo, 400/200 MHz)
        env:
          VOLT_STA_STA: docker run --rm -v {work}:/work -w /work --entrypoint /OpenSTA/build/sta opensta:pinned
        run: python3 scripts/sta/run.py --design examples/hybrid_accel/hybrid_top.volt --top HybridTop
      # ADR-0079 output net: every .sdc the corpus produces (both styles)
      # read by OpenSTA -- no Error/Warning, every get_cells pattern names a cell.
      # ADR-0107: the fixtures marked NET-SKIP / SYNTH-SKIP are left out, each
      # printed with the reason its marker carries (and as a notice). Two today:
      # tests/ui/pass/62_extern_domains.volt (extern modules without an
      # @source body) and 69_opendrain_basic.volt (Yosys cannot parse the
      # 'tri1' pull-up net). A new marker changes this count in the same PR.
      - name: Output net - every .sdc through OpenSTA read_sdc (ADR-0079)
        env:
          VOLT_STA_STA: docker run --rm -v {work}:/work -w /work --entrypoint /OpenSTA/build/sta opensta:pinned
        run: python3 scripts/sta/sweep.py --expect-excluded 2
      - name: Upload OpenSTA reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opensta-reports
          path: |
            build/sta/*/summary.md
            build/sta/*/*.sta.log
            build/sta/*/*.yosys.log
            build/sta/*/*_named.v
            build/sta/*/*.sdc
            build/sta/sweep/summary.md

  coverage:
    name: Coverage (informational)
    runs-on: ubuntu-latest
    # Informational: no threshold yet, and the job is not a required check in
    # branch protection, so a red run does not block a PR. Failures are not
    # hidden: no continue-on-error, a failed Codecov upload turns the job red.
    # Tool-less on purpose: with the OSS CAD Suite and VOLT_REQUIRE_TOOLS the
    # line total rose 90.56% -> 91.30% (sim_struct.rs, sim/run_cmd.rs,
    # sim/test_cmd.rs) but the coverage step took 4m12s instead of 1m04s
    # (warm caches, PR #59), over the +2 min budget. Those paths still run
    # against the real tools in the Verilator lint job.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: extractions/setup-just@v2
      - uses: Swatinem/rust-cache@v2
      - name: Coverage report
        run: just coverage
      # ADR-0107: how many tests skipped for a missing tool, and which.
      - name: Tool ledger - SKIP count
        if: always()
        run: python3 scripts/ci/tool_ledger.py report "$VOLT_TOOL_LEDGER" --job coverage
      - name: Upload tool ledger
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tool-ledger-coverage
          path: ${{ env.VOLT_TOOL_LEDGER }}
          if-no-files-found: ignore
      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: target/llvm-cov/html/
      # fail_ci_if_error: a failed upload turns the step and the job red.
      - name: Upload lcov to Codecov
        uses: codecov/codecov-action@2320916714171c258d01dbd81040d64d798c6f8e # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/llvm-cov/lcov.info
          disable_search: true
          fail_ci_if_error: true
          verbose: true

  fuzz:
    name: Fuzz (60 s)
    runs-on: ubuntu-latest
    # Short smoke run on every push/PR. The long run (30 min, corpus carried
    # over between nights) lives in fuzz-nightly.yml. The nightly corpus is
    # restored read-only here (caches saved on main are visible to PRs), so
    # the 60 s start from everything the nightly job has already found.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Restore nightly corpus (read-only)
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/parse_never_panics
          key: fuzz-corpus-parse_never_panics-${{ github.run_id }}
          restore-keys: fuzz-corpus-parse_never_panics-
      # First corpus dir receives new inputs; tests/ui and the fuzz regression
      # inputs (ADR-0067) are read-only seeds. -max_len is fixed (ADR-0080 §6):
      # otherwise libFuzzer takes the largest seed as the limit, and the 60 KB
      # stack_* regressions made every mutated input up to 60 KB (1221 -> 713
      # exec/s). Longer seeds are truncated to a 4 KB prefix, which still
      # nests past the 256-level depth limit.
      - name: parse_never_panics (60 s)
        run: |
          mkdir -p fuzz/corpus/parse_never_panics
          cargo +nightly fuzz run parse_never_panics \
            "$GITHUB_WORKSPACE/fuzz/corpus/parse_never_panics" \
            "$GITHUB_WORKSPACE/tests/ui" \
            "$GITHUB_WORKSPACE/tests/fuzz_regressions" \
            -- -max_total_time=60 -max_len=4096
      - name: Upload crash input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-parse_never_panics
          path: fuzz/artifacts/parse_never_panics/

  docker-backend:
    name: Docker backend (no local Verilator/sby)
    runs-on: ubuntu-latest
    # ADR-0094: with neither Verilator nor sby installed, volt test / verify /
    # run fall back to the digest-pinned images. The e2e test runs volt new
    # --template cdc, volt test, volt verify and uart_tx volt run --vcd through
    # real Docker and checks that every generated file belongs to the runner
    # user (not root) and that no container path reaches the output.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: No local Verilator or sby
        run: |
          if command -v verilator || command -v sby; then exit 1; fi
          docker version --format "{{.Server.Version}}"
      - name: Docker bridge end to end (real images)
        env:
          VOLT_DOCKER_E2E: "1"
        run: cargo test -p volt-driver --test docker_e2e_tests -- --nocapture
      # ADR-0107: how many tests skipped for a missing tool, and which.
      - name: Tool ledger - SKIP count
        if: always()
        run: python3 scripts/ci/tool_ledger.py report "$VOLT_TOOL_LEDGER" --job docker-backend --require-zero-skips --min-ran 1
      - name: Upload tool ledger
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tool-ledger-docker-backend
          path: ${{ env.VOLT_TOOL_LEDGER }}
          if-no-files-found: ignore
      - name: Generated files belong to the runner user
        run: |
          left=$(find "$(pwd)/target/tmp" -path "*volt-docker-e2e*" ! -user "$(id -u)" | head -5)
          test -z "$left" || { echo "not owned by $(id -un): $left"; exit 1; }

  tool-coverage:
    name: Tool coverage (every tool test ran with its tool required)
    runs-on: ubuntu-latest
    # ADR-0107: the tool-less job sees every test that asks for a tool (it
    # skips there, or finds a compiler the runner ships). Each of those
    # (test, tool) pairs must have RAN in a tool job with the tool in
    # VOLT_REQUIRE_TOOLS; one that never ran, or ran only where its tool was
    # optional, fails this job by name. Runs after a failed job too, so a
    # missing ledger is reported instead of hidden.
    needs: [test, integration, docker-backend]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: tool-ledger-*
          path: ledgers
      - name: Ledgers
        run: ls -l ledgers/*/ || true
      - name: Script self-test
        run: python3 scripts/ci/tool_ledger.py --self-test
      - name: Every tool test ran with its tool required
        run: |
          python3 scripts/ci/tool_ledger.py cover \
            --inventory ledgers/tool-ledger-test/volt-tool-ledger.tsv \
            --tools ledgers/tool-ledger-integration/volt-tool-ledger.tsv \
                    ledgers/tool-ledger-docker-backend/volt-tool-ledger.tsv
