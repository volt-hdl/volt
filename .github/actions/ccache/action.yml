name: ccache for Verilator builds
description: >-
  Compiles the C++ of every Verilator build of the job through ccache and
  keeps the cache between runs. Verilator's verilated.mk compiles each file
  as `$(OBJCACHE) $(CXX) ...`; .github/actions/verilator blanks the image's
  `OBJCACHE ?= ccache`, and this action sets OBJCACHE to a pinned ccache
  in the job's environment. Call it twice: `phase: start` right
  after .github/actions/verilator, and `phase: end` with `if: always()`
  after the steps that build with Verilator. The end phase prints the hits
  and misses (scripts/ci/ccache_report.py), fails when a successful job
  compiled nothing through ccache, and saves the cache. ccache never
  changes generated code; a missing or damaged cache only costs time.

inputs:
  phase:
    description: "start (before the Verilator builds) or end (after them, with if: always())"
    required: true
  job:
    description: "Name of the job's cache (part of the actions/cache key)"
    required: true
  enabled:
    description: >-
      start phase: "on", or "off" to build without ccache (a workflow_dispatch
      input; the log says so in a warning)
    required: false
    default: "on"
  job-status:
    description: "end phase: job.status of the calling job"
    required: false
    default: ""

runs:
  using: composite
  steps:
    # ccache is a pinned release (static binary), checked against its
    # sha256 and cached like Verilator: installing it with apt cost 14 to
    # 42 s per job (apt-get update and the dpkg database), as much as the
    # cache saves in a job with few Verilator builds.
    - name: ccache - pinned release
      id: pin
      if: inputs.phase == 'start'
      shell: bash
      env:
        ENABLED: ${{ inputs.enabled }}
        JOB_NAME: ${{ inputs.job }}
      run: |
        set -euo pipefail
        case "$ENABLED" in
          on) ;;
          off)
            echo "::warning title=ccache [$JOB_NAME]::ccache is OFF in this run (input ccache=off): every Verilator build compiles without a cache"
            echo "VOLT_CI_CCACHE=off" >> "$GITHUB_ENV"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
            ;;
          *)
            echo "::error title=ccache [$JOB_NAME]::input enabled must be 'on' or 'off', got '$ENABLED'"
            exit 1
            ;;
        esac
        # https://github.com/ccache/ccache/releases/tag/v4.14.2; the digest
        # is the one GitHub lists for the asset.
        {
          echo "enabled=true"
          echo "version=4.14.2"
          echo "asset=ccache-4.14.2-linux-x86_64-musl-static"
          echo "sha256=b20ff6415151226ac5a10dfd6839700c694bd67d1871c8fddb266d366ff25bfb"
        } >> "$GITHUB_OUTPUT"

    - name: ccache - cache the binary
      id: bin
      if: inputs.phase == 'start' && steps.pin.outputs.enabled == 'true'
      uses: actions/cache@v6
      with:
        path: ~/ccache-bin
        key: ccache-bin-${{ steps.pin.outputs.asset }}-${{ steps.pin.outputs.sha256 }}

    - name: ccache - download ${{ steps.pin.outputs.version }}, with retries
      if: inputs.phase == 'start' && steps.pin.outputs.enabled == 'true' && steps.bin.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ steps.pin.outputs.version }}
        ASSET: ${{ steps.pin.outputs.asset }}
        SHA256: ${{ steps.pin.outputs.sha256 }}
      run: |
        set -euo pipefail
        url="https://github.com/ccache/ccache/releases/download/v$VERSION/$ASSET.tar.xz"
        if ! curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/ccache.tar.xz" "$url"; then
          echo "::error title=ccache::could not download $url: the Verilator builds would compile without a cache. Re-run the job"
          exit 1
        fi
        if ! echo "$SHA256  $RUNNER_TEMP/ccache.tar.xz" | sha256sum -c -; then
          echo "::error title=ccache::$url does not have the pinned sha256 $SHA256"
          exit 1
        fi
        tar -xJf "$RUNNER_TEMP/ccache.tar.xz" -C "$RUNNER_TEMP"
        mkdir -p "$HOME/ccache-bin"
        cp "$RUNNER_TEMP/$ASSET/ccache" "$HOME/ccache-bin/ccache"
        rm -rf "$RUNNER_TEMP/ccache.tar.xz" "$RUNNER_TEMP/$ASSET"

    # Checks ccache, finds the compiler verilated.mk calls and builds the
    # cache key: the OS image, the compiler's version and Verilator's.
    - name: ccache - check and configure
      id: start
      if: inputs.phase == 'start' && steps.pin.outputs.enabled == 'true'
      shell: bash
      env:
        JOB_NAME: ${{ inputs.job }}
        VERSION: ${{ steps.pin.outputs.version }}
      run: |
        set -euo pipefail
        ccache="$HOME/ccache-bin/ccache"
        # The `if` keeps set -e from stopping before the error message.
        if ! found=$("$ccache" --version 2> /dev/null | head -n 1) || [ "$found" != "ccache version $VERSION" ]; then
          echo "::error title=ccache [$JOB_NAME]::ccache $VERSION is not installed at $ccache (got: '${found:-nothing}'): the Verilator builds of this job would compile without a cache, several times slower. Re-run the job; a run without ccache on purpose takes the workflow_dispatch input ccache=off"
          exit 1
        fi
        echo "$HOME/ccache-bin" >> "$GITHUB_PATH"
        echo "ccache: $ccache, $found"

        if [ -z "${VERILATOR_ROOT:-}" ] || [ ! -f "$VERILATOR_ROOT/include/verilated.mk" ]; then
          echo "::error title=ccache [$JOB_NAME]::no verilated.mk under VERILATOR_ROOT='${VERILATOR_ROOT:-}': run .github/actions/verilator first"
          exit 1
        fi
        mk="$VERILATOR_ROOT/include/verilated.mk"
        # .github/actions/verilator leaves `OBJCACHE ?=`: the variable comes
        # from the environment, and make prefixes every compile with it.
        if ! grep -qx 'OBJCACHE ?=' "$mk"; then
          echo "::error title=ccache [$JOB_NAME]::$mk has no 'OBJCACHE ?=' line: the environment's OBJCACHE would not decide"
          exit 1
        fi
        grep -n -e '^OBJCACHE' -e '^CXX' "$mk"
        cxx=$(sed -n 's/^CXX = //p' "$mk")
        if [ -z "$cxx" ] || ! command -v "$cxx" > /dev/null; then
          echo "::error title=ccache [$JOB_NAME]::the compiler of verilated.mk ('CXX = $cxx') is not on PATH"
          exit 1
        fi
        cxx_line=$("$cxx" --version | head -n 1)
        cxx_version=$("$cxx" -dumpfullversion)
        # The first line names the distribution's build ("Ubuntu
        # 13.3.0-6ubuntu2~24.04.1"); its hash keeps the key short.
        cxx_hash=$(printf '%s' "$cxx_line" | sha256sum | cut -c1-8)
        verilator_version=$(verilator --version | awk '{print $2}')
        image="${ImageOS:-}-${ImageVersion:-}"
        if [ -z "${ImageOS:-}" ] || [ -z "${ImageVersion:-}" ]; then
          echo "::error title=ccache [$JOB_NAME]::ImageOS or ImageVersion is not set (not a GitHub-hosted runner?): the cache key needs the OS image"
          exit 1
        fi
        prefix="ccache-v1-$image-$cxx$cxx_version-$cxx_hash-verilator$verilator_version-ccache$VERSION"
        echo "compiler: $cxx ($cxx_line)"
        echo "Verilator: $verilator_version; OS image: $image"
        dir="$HOME/.cache/volt-ccache"
        {
          echo "dir=$dir"
          echo "key=$prefix-$JOB_NAME-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "job-prefix=$prefix-$JOB_NAME-"
          echo "prefix=$prefix-"
        } >> "$GITHUB_OUTPUT"
        {
          echo "VOLT_CI_CCACHE=on"
          # The absolute path: make runs whatever OBJCACHE names.
          echo "OBJCACHE=$ccache"
          echo "CCACHE_DIR=$dir"
          # A bound: the end phase drops every entry this run did not use.
          echo "CCACHE_MAXSIZE=1G"
        } >> "$GITHUB_ENV"

    # The most recent cache of this job, else of any job with the same
    # image, compiler and Verilator. A miss or a failed download is a cold
    # start; ccache checks every entry it reads and compiles again when one
    # is damaged.
    - name: ccache - restore the cache of an earlier run
      id: restore
      if: inputs.phase == 'start' && steps.pin.outputs.enabled == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/volt-ccache
        key: ${{ steps.start.outputs.key }}
        restore-keys: |
          ${{ steps.start.outputs.job-prefix }}
          ${{ steps.start.outputs.prefix }}

    - name: ccache - zero the statistics
      if: inputs.phase == 'start' && steps.pin.outputs.enabled == 'true'
      shell: bash
      env:
        JOB_NAME: ${{ inputs.job }}
        MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
        KEY: ${{ steps.start.outputs.key }}
        JOB_PREFIX: ${{ steps.start.outputs.job-prefix }}
      run: |
        set -euo pipefail
        if [ -n "$MATCHED" ]; then
          echo "ccache [$JOB_NAME]: restored $MATCHED"
        else
          echo "::notice title=ccache [$JOB_NAME]::no cache restored: a cold start, every first compile is a miss"
        fi
        case "$MATCHED" in
          "$JOB_PREFIX"*) own=true ;;
          *) own=false ;;
        esac
        {
          echo "VOLT_CI_CCACHE_KEY=$KEY"
          echo "VOLT_CI_CCACHE_OWN_RESTORED=$own"
          echo "VOLT_CI_CCACHE_START=$(date +%s)"
        } >> "$GITHUB_ENV"
        "$OBJCACHE" --zero-stats
        "$OBJCACHE" --show-stats
        echo "From here every Verilator build of this job compiles through ccache (OBJCACHE=$OBJCACHE, CCACHE_DIR=$CCACHE_DIR)"

    # Hits and misses of this job, then only the entries this run used are
    # kept: a hit renews an entry's time, so the cache stays the working
    # set of the job instead of growing from run to run.
    - name: ccache - statistics of this job
      id: end
      # always(): inside a composite action a bare condition means
      # success() && ..., and the statistics are wanted after a failure too.
      if: always() && inputs.phase == 'end'
      shell: bash
      env:
        JOB_NAME: ${{ inputs.job }}
        JOB_STATUS: ${{ inputs.job-status }}
        EVENT: ${{ github.event_name }}
      run: |
        set -euo pipefail
        case "${VOLT_CI_CCACHE:-}" in
          off)
            echo "::warning title=ccache [$JOB_NAME]::ccache was OFF in this run (input ccache=off)"
            echo "save=false" >> "$GITHUB_OUTPUT"
            echo "check=false" >> "$GITHUB_OUTPUT"
            exit 0
            ;;
          on) ;;
          *)
            if [ "$JOB_STATUS" = success ]; then
              echo "::error title=ccache [$JOB_NAME]::the start phase of .github/actions/ccache did not run in this job"
              exit 1
            fi
            echo "ccache [$JOB_NAME]: the job stopped before ccache was set up ($JOB_STATUS)"
            echo "save=false" >> "$GITHUB_OUTPUT"
            echo "check=false" >> "$GITHUB_OUTPUT"
            exit 0
            ;;
        esac
        python3 scripts/ci/ccache_report.py --self-test
        stats="$RUNNER_TEMP/ccache-stats.tsv"
        "$OBJCACHE" --print-stats > "$stats"
        "$OBJCACHE" --show-stats --verbose
        python3 scripts/ci/ccache_report.py "$stats" --job "$JOB_NAME"
        # Older than the start of the tests: restored and not used since.
        age=$(( $(date +%s) - VOLT_CI_CCACHE_START ))
        if [ "$age" -lt 1 ]; then age=1; fi
        "$OBJCACHE" --evict-older-than "${age}s"
        echo "After dropping the entries this run did not use:"
        "$OBJCACHE" --show-stats
        # A pull request saves only a cold start of its own job; main, the
        # nightly run and a dispatched run always save. A failed job saves
        # nothing (its cache may hold only part of the working set).
        save=false
        if [ "$JOB_STATUS" = success ] && { [ "$EVENT" != pull_request ] || [ "$VOLT_CI_CCACHE_OWN_RESTORED" = false ]; }; then
          save=true
        fi
        echo "ccache [$JOB_NAME]: save the cache as $VOLT_CI_CCACHE_KEY: $save (job $JOB_STATUS, event $EVENT, own cache restored: $VOLT_CI_CCACHE_OWN_RESTORED)"
        echo "save=$save" >> "$GITHUB_OUTPUT"
        # A failed job may have stopped before its Verilator builds.
        if [ "$JOB_STATUS" = success ]; then
          echo "check=true" >> "$GITHUB_OUTPUT"
        else
          echo "check=false" >> "$GITHUB_OUTPUT"
        fi

    - name: ccache - save the cache
      if: always() && inputs.phase == 'end' && steps.end.outputs.save == 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/volt-ccache
        key: ${{ env.VOLT_CI_CCACHE_KEY }}

    # Last, after the save: a successful job whose Verilator builds did not
    # go through ccache fails here instead of staying silently slow.
    - name: ccache - the Verilator builds went through ccache
      if: always() && inputs.phase == 'end' && steps.end.outputs.check == 'true'
      shell: bash
      env:
        JOB_NAME: ${{ inputs.job }}
      run: python3 scripts/ci/ccache_report.py "$RUNNER_TEMP/ccache-stats.tsv" --job "$JOB_NAME" --require-use --quiet
