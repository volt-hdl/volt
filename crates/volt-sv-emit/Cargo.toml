[package]
name = "volt-sv-emit"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# #407 Aşama 1 (ADR-0136): üreticinin ifade genişliklerini kaydeder; yalnız
# volt-driver'ın testleri açar (dev-dependency). Üretilen SV'yi değiştirmez.
width-shadow = []

[dependencies]
volt-ast = { path = "../volt-ast" }
volt-span = { path = "../volt-span" }
volt-diagnostics = { path = "../volt-diagnostics" }

[dev-dependencies]
volt-syntax = { path = "../volt-syntax" }
# #413 (ADR-0141): testler sürücünün yolunu izler, üretici tip denetiminin
# tablosunu okur (`tests/typed`). Yalnız test derlemesi; üretici volt-hir'e
# bağlanmaz (ADR-0136).
volt-hir = { path = "../volt-hir" }
