# cargo-mutants configuration (ADR-0109). cargo-mutants 27.1.0 reads this
# file from the workspace root; the workflow is .github/workflows/mutants.yml
# (on every pull request: the mutants on the changed lines; by hand:
# workflow_dispatch, sharded). Never run the full set locally: list it
# (`cargo mutants --list`) or try one small file with `-j 1`.

# Scope (ADR-0109 appendix "PR kapısı ve varsayılan kapsam", #253): every
# crate's src/ is mutated. A file stays out only by name, in exclude_globs
# below, with its own reason in the comment right above it. The consistency
# check (scripts/check-consistency.{sh,ps1}, check 19) fails when a .rs
# file in the src/ of a workspace member (root Cargo.toml) is neither
# matched by examine_globs nor listed in exclude_globs, and when an
# exclude_globs entry is a pattern instead of
# a path, names no file, or has no reason above it. cargo-mutants mutates
# the files reachable from each crate root through `mod`: a module under
# #[cfg(test)] has no mutant.
examine_globs = ["crates/*/src/**/*.rs"]

exclude_globs = [
    # volt-difftest (ADR-0108) is a test tool, a dev-dependency of
    # volt-driver: it is not built into volt, and the compiler's mutants are
    # what it catches. Its own code is checked against Verilator by the
    # differential test itself; mutating it measures the test, not the
    # compiler. The reason of each file:
    # The expression tree of the generator, independent of the compiler's AST.
    "crates/volt-difftest/src/ast.rs",
    # The random expression generator: a mutant changes which expressions
    # are tried, not a result anything checks.
    "crates/volt-difftest/src/gen.rs",
    # The Volt module, the SV testbench and the input vectors of a batch.
    "crates/volt-difftest/src/harness.rs",
    # The name-hygiene relation (#128): the Volt text of a moved expression.
    "crates/volt-difftest/src/hygiene.rs",
    # The crate root: module list and the run's entry points.
    "crates/volt-difftest/src/lib.rs",
    # The reference model, written from the specification; Verilator checks
    # it on every run (a model mutant shows as a difference), so its mutants
    # measure the differential test. Whether to mutate it, as a measure of
    # the differential test itself, is decided in #255.
    "crates/volt-difftest/src/model.rs",
    # The Volt text of an expression (minimal and full parentheses).
    "crates/volt-difftest/src/print.rs",
    # The regression corpus: data, one minimized example per issue.
    "crates/volt-difftest/src/regress.rs",
    # The seeded generator (SplitMix64): a mutant changes the expressions drawn.
    "crates/volt-difftest/src/rng.rs",
    # The runner: generate, volt check, volt build, Verilator, compare.
    "crates/volt-difftest/src/run.rs",
    # Bit-pattern helpers of the model.
    "crates/volt-difftest/src/value.rs",
]

# Equivalent mutants (group A of ADR-0109 section 4): a mutation that
# changes no observable output (generated SV, diagnostic codes, diagnostic
# text) for any input. Each entry is a regex over the mutant name as
# `cargo mutants --list` prints it, with its reason in a comment above it.
# Exclusions live here, never as `#[mutants::skip]` in the code.
# A1: equivalent within the function itself, whatever calls it.
# A2: equivalent given today's callers or the text the emitter writes; the
#     comment names that assumption. When the function or caller an A2
#     entry rests on changes, the entry is reviewed again.
# C (#283): a suspect mutant, one that suggests today's behavior
#     contradicts the specification, is not fixed in the pull request that
#     finds it (ADR-0109 section 4): it gets a "silent-wrong?" issue and an
#     entry whose reason opens with `C.` and that names the issue on one
#     `# issue: #N` line, next to its `# expect:` lines. The gate passes the
#     mutant while the issue is open. The exclusion check fails when the
#     issue is closed or does not exist, and when a pull request closes it
#     (`Closes #N`) while the entry still stands: the fix removes the entry,
#     and the gate tries the mutant again.
# An entry names the file, the change and the function; it pins line:col
# only where the same change occurs twice in that function.
# Every entry names the mutants it was written for, one `# expect:` line
# each, exactly as `cargo mutants --list` prints them (#239). The mutation
# workflow checks that each entry matches exactly those mutants in the list
# before the exclusions (scripts/ci/mutants_exclusions.py): an entry that
# matches nothing, misses an expected mutant or matches another one fails
# it. When the code moves, update the line:col of the expect: lines (and
# of a pinned entry) to the statement the entry was written for; the error
# shows the mutants with the same file, change and function.
# Source: run 41905442445 (952 mutants, 157 missed).
