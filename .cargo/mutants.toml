    # expect: crates/volt-syntax/src/parser/desugar.rs:1191:18: replace match guard matches!(else_stmts[0], BlockStmt::If(_)) with false in Parser<'_>::if_else
    "parser/desugar\\.rs:\\d+:\\d+: replace match guard matches!\\(else_stmts\\[0\\], BlockStmt::If\\(_\\)\\) with false in Parser<'_>::if_else$",
    # A2, assumes ConstEvaluator::const_eval gives ConstValue::Int for a path
    # only when it names a `const` (DefKind::Const): an enum variant gives
    # ConstValue::EnumVariant and every other kind (port, wire, register,
    # let, loop or generic parameter) ConstValue::Error, so try_const_eval
