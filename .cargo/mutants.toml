# cargo-mutants configuration (ADR-0109). cargo-mutants 27.1.0 reads this
# file from the workspace root; the workflow is .github/workflows/mutants.yml
# (workflow_dispatch, sharded). Never run the full set locally: list
# it (`cargo mutants --list`) or try one small file with `-j 1`.

# Scope, phase 1: the files below are mutated, no other file or crate is
# in scope in this phase (ADR-0109 section 2 lists what comes next).
examine_globs = [
    # 1. SystemVerilog emission of expressions: precedence, signed casts and
    #    literals, isolation of width-dependent sub-expressions (ADR-0106 §6,
    #    ADR-0108), self-determined positions, select forms.
    "crates/volt-sv-emit/src/expr.rs",
    # Name resolution of the emitter: the scope chain every lookup goes
    # through (moved out of expr.rs, #128).
    "crates/volt-sv-emit/src/scope.rs",
    # Wire width of an untyped `let` (natural width, ADR-0025).
    "crates/volt-sv-emit/src/let_width.rs",
    # Emitter files that resolve names through Emitter::resolve (#128):
    # constant arrays, enum-typed values and patterns, trit selection.
    "crates/volt-sv-emit/src/const_array.rs",
    "crates/volt-sv-emit/src/enums.rs",
    "crates/volt-sv-emit/src/trit.rs",
    # Uninstantiated generic module: skipped by the emitter, W1006 in the
    # main file (#143, ADR-0111).
    "crates/volt-sv-emit/src/template.rs",
    # The parser's substitution of generic parameters and module-level
    # `for` variables: the scope chain and the cloner that consults it
    # (#130, ADR-0081 appendix).
    "crates/volt-syntax/src/parser/mono/scope.rs",
    "crates/volt-syntax/src/parser/mono/clone.rs",
    "crates/volt-syntax/src/parser/mono/pattern.rs",
    # The monomorphization table and the module name a generic instance
    # gets (#205): keyed by (template, argument values); two different
    # templates that build one name are E1003 (ADR-0090).
    "crates/volt-syntax/src/parser/mono/mod.rs",
    # The parser's other name-matching steps, wired to the same scope chain
    # (#136, #137, #138; ADR-0081 appendix): bundle flattening, bidirectional
    # ports (parse-time `p.drive(v)` in stmt.rs, the post pass in bidir.rs),
    # the @mmio handle, pipeline stage values, inferred counter and FSM
    # contracts, and the module chain and constant evaluation they share.
    "crates/volt-syntax/src/parser/bundle.rs",
    "crates/volt-syntax/src/parser/bidir.rs",
    "crates/volt-syntax/src/parser/stmt.rs",
    "crates/volt-syntax/src/parser/mmio.rs",
    "crates/volt-syntax/src/parser/desugar.rs",
    "crates/volt-syntax/src/parser/mono/unroll.rs",
    # The parser's diagnostic entry points (#206): push_error keeps the
    # cascade-suppression window (error-recovery.md §5) for errors only;
    # push_diag adds warnings and the desugar passes' diagnostics outside
    # it. A warning that opened the window swallowed the next error, and
    # the source was accepted with exit 0.
    "crates/volt-syntax/src/parser/mod.rs",
    "crates/volt-syntax/src/parser/auto_contract/mod.rs",
    "crates/volt-syntax/src/parser/auto_contract/scan.rs",
    "crates/volt-syntax/src/parser/auto_contract/counter.rs",
    "crates/volt-syntax/src/parser/auto_contract/fsm.rs",
    # Visibility across files (#139, ADR-0042 appendix): the rule the
    # resolver and the parser's unit-end steps share, the import check
    # that builds the file scopes, the resolver's root lookup, and the
    # Handshake payload lookup.
    "crates/volt-ast/src/visibility.rs",
    "crates/volt-syntax/src/unit.rs",
    "crates/volt-hir/src/resolve/imports.rs",
    "crates/volt-syntax/src/parser/handshake.rs",
    # 2. Width and type inference.
    "crates/volt-hir/src/ty.rs",
    "crates/volt-hir/src/typeck/width.rs",
    "crates/volt-hir/src/typeck/binop.rs",
    # W2016: an arithmetic operand cut before the operation; the context's
    # read width, the value-range proof and the take-over by W2015 and a
    # narrowing `as` (#266, ADR-0116).
    "crates/volt-hir/src/typeck/arith_cut.rs",
    # E2031: comparison of different natural widths (ADR-0106).
    "crates/volt-hir/src/typeck/compare_width.rs",
    # W2010: narrowing `as`; E2009.
    "crates/volt-hir/src/typeck/cast.rs",
    "crates/volt-hir/src/typeck/check.rs",
    "crates/volt-hir/src/typeck/synth.rs",
    # `let` statements, natural-width `let`.
    "crates/volt-hir/src/typeck/stmt.rs",
    "crates/volt-hir/src/typeck/select.rs",
    # Literal arithmetic folded with its exact value: E2010, E2022, E2023
    # (#144; the emitter's side is fold_literal_arith in expr.rs).
    "crates/volt-hir/src/typeck/literal_fold.rs",
    # 3. Module summary at instance sites (#189, #193, ADR-0114): the
    #    shared combinational graph and the summaries, the E4007 check that
    #    reads them, the clock domain of a clockless target's outputs with
    #    the instance-site E3001 and the two-edit sync() fix, and the
    #    built-in table.
    "crates/volt-hir/src/summary.rs",
    "crates/volt-hir/src/handshake.rs",
    "crates/volt-hir/src/domain/instance.rs",
    "crates/volt-hir/src/domain/assign.rs",
    "crates/volt-ast/src/builtin.rs",
]

# Equivalent mutants (group A of ADR-0109 section 4): a mutation that
# changes no observable output (generated SV, diagnostic codes, diagnostic
# text) for any input. Each entry is a regex over the mutant name as
# `cargo mutants --list` prints it, with its reason in a comment above it.
# Exclusions live here, never as `#[mutants::skip]` in the code.
# A1: equivalent within the function itself, whatever calls it.
# A2: equivalent given today's callers or the text the emitter writes; the
#     comment names that assumption. When the function or caller an A2
#     entry rests on changes, the entry is reviewed again.
# An entry names the file, the change and the function; it pins line:col
# only where the same change occurs twice in that function. A pinned entry
# that stops matching after an edit lets its mutant back in (it shows up as
# missed again): it never hides a different mutant without that showing.
# Source: run 41905442445 (952 mutants, 157 missed).
exclude_re = [
    # A1. `Some(s) if vstage == s` is the arm before `vstage < s`, so at
    # vstage == s the `<=` mutant never reaches its arm (#137 targeted run).
    "parser/desugar\\.rs:\\d+:\\d+: replace < with <= in Parser<'_>::rw_expr$",
    # A2, assumes a module-level `=` to a register is always E0019
    # (register_assign.rs, ADR-0098): without this arm the register gets a
    # counter contract, but the build stops at E0019 and the diagnostics are
    # the same (parser_rewrite_scope_diag_tests::
    # a_counter_assigned_at_module_level_is_only_e0019; #138 targeted run).
    "parser/auto_contract/scan\\.rs:\\d+:\\d+: delete match arm StmtKind::Assign\\(a\\) in scan_module$",
    # A1. `a == b || (a < b && ...)`: with `<=`, a == b is already true from
    # the first disjunct.
    "typeck/check\\.rs:\\d+:\\d+: replace < with <= in TypeChecker<'_, '_>::expect_assignable$",
    # A1. `lhi > rhi`: lhi == rhi returns on the line before, so `>=` and `>`
    # agree wherever this line runs.
    "typeck/compare_width\\.rs:\\d+:\\d+: replace > with >= in TypeChecker<'_, '_>::check_comparison_widths$",
    # A1. Sig is {width, signed}; with equal sign and equal width, c == d, so
    # returning c instead of d returns the same value.
    "volt-sv-emit/src/expr\\.rs:\\d+:\\d+: replace > with >= in widen_sig$",
    # A1. `value >= 0 && w < 128 && value > max`: at w == 128, max is
    # 2^127 - 1 (signed) or u128::MAX, and a non-negative i128 never exceeds
    # either.
    "volt-sv-emit/src/expr\\.rs:2040:28: replace < with <= in Emitter<'a>::fmt_int$",
    # A1. `value < 0 && ... && mag >= 2^(w-1)`: at value == 0, mag is 0,
    # below 2^(w-1) for every width w >= 1.
    "volt-sv-emit/src/expr\\.rs:2047:32: replace < with <= in Emitter<'a>::fmt_int$",
    # A1. `l.hi > r.hi` runs only after the arm for l.hi == r.hi.
    "volt-sv-emit/src/let_width\\.rs:\\d+:\\d+: replace > with >= in Emitter<'_>::comparison_ctx$",
    # A1. demand(): at c.width == width both arms return the same number.
    "volt-sv-emit/src/let_width\\.rs:\\d+:\\d+: replace < with <= in demand$",
    # A2, assumes the emitter writes `'(` only after a decimal width (every
    # `{}'(` format in expr.rs): `>=` adds text that starts with a bare `'(`.
    "volt-sv-emit/src/expr\\.rs:\\d+:\\d+: replace > with >= in starts_with_size_cast$",
    # A2, assumes is_right_operand is true only from the binary-operator
    # callers, which pass sv_prec 1..=10: then my_prec == parent_prec >= 1
    # and `>= 0` changes nothing.
    "volt-sv-emit/src/expr\\.rs:1352:93: replace > with >= in Emitter<'a>::emit_prec$",
    # A2, assumes no caller passes a parent_prec above PREC_ATOM (the
    # highest) and a right operand's parent has 1..=10: an atom never needs
    # parentheses.
    "volt-sv-emit/src/expr\\.rs:1353:35: replace < with <= in Emitter<'a>::emit_prec$",
    # A2, assumes a select width fits a u16 (type check, base_width: u16), so
    # need <= 16: the arm runs when the start is 127+ bits wide or when
    # down >= 2^width (then need > width); sig.width == need is impossible.
    "volt-sv-emit/src/expr\\.rs:1605:48: replace < with <= in Emitter<'a>::part_select_from_value$",
    # A2, assumes demand()'s two readers (flex_demand in let_width.rs,
    # Local::read in match_expr.rs) compare its result with `>= width` or
    # `< width` alone: returning c.width >= width instead of width for a
    # context at least as wide as the wire decides the same.
    "volt-sv-emit/src/let_width\\.rs:\\d+:\\d+: replace match guard c\\.width < width with true in demand$",
    # Source: targeted run 42034192061 (#130; parser/mono, 276 mutants).
    # A1. fold_binary: `BinOp::Div if r != 0 => l.checked_div(r)` (and Rem):
    # with the guard `true`, r == 0 gives checked_div/checked_rem -> None,
    # the same as the `_ => None` arm the guard falls through to.
    "parser/mono/clone\\.rs:\\d+:\\d+: replace match guard r != 0 with true in Cloner<'a>::fold_binary$",
    # A2, assumes the parser never builds ExprKind::Concat: only the SV
    # emitter's struct lowering does (ADR-0077 Karar 5; volt-ast doc).
    "parser/mono/clone\\.rs:\\d+:\\d+: delete match arm ExprKind::Concat\\(parts\\) in Cloner<'a>::clone_aggregate_expr$",
    # A2, assumes enums with data-carrying variants stay unsupported (E0003):
    # a struct-pattern shorthand (`Msg::Data { x }`) never reaches the SV, and
    # without the binding the arm body's diagnostics are the same
    # (parser_scope_diag_tests::enum_patterns_in_a_clone_keep_their_arguments_and_bindings).
    # Review when payload enums are implemented.
    "parser/mono/clone\\.rs:\\d+:\\d+: replace Cloner<'a>::declare_pattern_binding with \\(\\)$",
    # A2 (unreachable), assumes the type checker rejects a variant pattern of
    # another enum before emission (E2003 "pattern of type 'Kind' cannot
    # match a value of enum 'Mode'", typeck/matching.rs;
    # parser_scope_diag_tests::a_variant_pattern_of_another_enum_is_rejected_before_emission):
    # in pattern_variants `d` is always the scrutinee's enum.
    "volt-sv-emit/src/enums\\.rs:\\d+:\\d+: replace match guard d\\.name\\.text == decl\\.name\\.text with true in Emitter<'a>::pattern_variants$",
    # A2 (reachable, same SV), assumes `t` has passed is_trit (a Trit atom,
    # negation, Trit * Trit or `if`: SV precedence 12, 11, 10 or 0) and
    # emit_prec parenthesizes only when my_prec < parent_prec (is_right is
    # false here): parent Eq + 1 = 7, Eq * 1 = 6 and Eq - 1 = 5 decide alike.
    # With either mutant the SV of parser_scope_sim_tests::
    # trit_products_of_every_precedence_class_have_their_value is byte
    # identical, the simulation passes and verilator -Wall is clean.
    "volt-sv-emit/src/trit\\.rs:\\d+:\\d+: replace \\+ with \\* in Emitter<'_>::try_emit_trit_mul$",
    "volt-sv-emit/src/trit\\.rs:\\d+:\\d+: replace \\+ with - in Emitter<'_>::try_emit_trit_mul$",
    # A2 (unreachable), assumes every Path has at least one segment: the
    # grammar starts a path with an identifier (parse_path) and every
    # rewrite in parser/ builds one with a segment. The arm before takes
    # len >= 2, so `true` matches the same len == 1 paths. Inputs that try
    # an empty path at the two places value_of reads (`::Idle`, `State::`,
    # `State::::Idle`, an empty initial value or right-hand side) are E0001
    # and leave no segmentless path in the AST: auto_contract_tests::
    # inputs_that_try_an_empty_path_are_e0001_and_leave_no_empty_path
    # (#139 targeted run).
    "parser/auto_contract/mod\\.rs:\\d+:\\d+: replace match guard p\\.segments\\.len\\(\\) == 1 with true in value_of$",
    # Source: targeted run 42670004438 (#189, #193, ADR-0114; 114 mutants,
    # 9 missed: 8 are caught by the tests added with this entry).
    # A2 (unreachable), assumes a `match` expression never has a block arm:
    # parse_match_expr parses its arms with parse_match_arm(None), which
    # gives only MatchArmBody::Expr (a block arm is E0001), and every cloner
    # copies the arm kind it gets (mono/pattern.rs, desugar.rs, visit.rs).
    # Walker::block_reads is called from that arm alone; `comb`, `if` and
    # `match` statements go through Walker::block. summary.rs::tests::
    # a_match_expression_never_has_a_block_arm; module_summary_tests::
    # a_value_through_a_block_of_a_clockless_child_carries_its_domain passes
    # with the mutant. Review when match expressions get block arms.
    "volt-hir/src/summary\\.rs:\\d+:\\d+: replace Walker<'_>::block_reads with \\(\\)$",
    # Source: run 42888144192 (the five files of the module summary in full,
    # 228 mutants; ADR-0109 appendix "#189, #193").
    # A2 (unreachable), assumes the summaries are computed after a clean name
    # resolution (pipeline.rs) and an instance binding reads only outputs of
    # instances declared before it: reading a later instance or its own is
    # E1002. The expansion of an instance output then never re-enters an
    # open (instance, output), so the cut counter never moves; a loop through
    # instances goes through a wire, which is a plain read.
    # summary.rs::tests::an_instance_binding_cannot_read_a_later_or_its_own_instance;
    # with `-` or `*` the summary unit tests (a_combinational_loop_through_instances_terminates
    # among them; no overflow panic with `-`) and module_summary_tests pass.
    # Pinned: the same changes on the expansion counter, three lines below,
    # are caught. Review when a binding may read a later declaration.
    # Reviewed in #204 (targeted run 42962808806): the pin moved from 590:43
    # to 575:43 (lines removed above it, same statement). The assumption
    # still holds: a field-init shorthand binding is now `x: x`, a one-segment
    # path to a local, and reading an instance output is always a field
    # access (`p.y`), so the shorthand never reaches instance_output.
    "volt-hir/src/summary\\.rs:575:43: replace \\+ with [-*] in Walker<'_>::instance_output$",
    # A2 (unreachable), assumes a binding to a port the target lacks is E1009
    # in name resolution (Volt module and built-in primitive) and the
    # compiler stops before domain inference after a resolve error
    # (pipeline.rs): propagate_binding then runs only through the ungated
    # volt_hir::analyze, which the tests alone call.
    # domain::instance::tests::a_binding_to_a_missing_port_is_e1009_in_name_resolution.
    "volt-hir/src/domain/instance\\.rs:\\d+:\\d+: replace Inferencer<'a>::propagate_binding with \\(\\)$",
    # A1. `FieldTy::Bits(8)` is the arm before `Bits(w) if w > 8`, so the
    # `>=` mutant differs only at w == 8, which never reaches its guard
    # (#206 targeted run 43021294446).
    "parser/mmio\\.rs:\\d+:\\d+: replace > with >= in FieldTy::zero$",
    # A2, assumes the generated Volt text casts a widening zero without a
    # warning: with `==` a `bits<N>` field with N > 8 gets the `N < 8` form
    # `((false as u1) as uN) as bits<N>`, still N zero bits. Reachable; the
    # mutated compiler's SV for a 16-, 8- and 4-bit hardware field passes
    # `verilator --lint-only -Wall` without a warning and the simulated reset
    # value is 0 (desugar_blind_spot_tests::
    # hardware_bits_fields_reset_to_zero_at_every_width; #206 targeted run).
    # Review when the cast rules or the zero forms change.
    "parser/mmio\\.rs:\\d+:\\d+: replace > with == in FieldTy::zero$",
    # A2, the same assumption and the same test: with the guard `false` every
    # N > 8 field takes the `N < 8` form, as with `==` above.
    "parser/mmio\\.rs:\\d+:\\d+: replace match guard w > 8 with false in FieldTy::zero$",
    # A2, assumes the driver and the LSP register the generated @mmio text
    # that was parsed (ParseResult.generated) and that the text is never
    # written out: the mutant drops a comment line of the contract section
    # and shifts every later line of `<mmio:Name>` up by one, but each
    # diagnostic still shows, from the same text, the name it reports
    # (desugar_blind_spot_tests::
    # a_diagnostic_in_the_generated_mmio_source_shows_the_name_it_reports;
    # a registered text one line off fails it). Review when the generated
    # text is dumped to disk (an `--emit-mmio`) or registered separately.
    "parser/mmio\\.rs:\\d+:\\d+: delete ! in render_contracts$",
    # A2, assumes a parse error stops the build before name resolution: after
    # E5015 the mutant drops the cyclic lets instead of the placeholders, which
    # only resolution would show. desugar_blind_spot_tests::
    # e5015_names_the_values_on_the_cycle checks that E5015 is the only
    # diagnostic, with an undefined name in the same file. Pinned: the same
    # change at 883 and 889 in order_lets is caught (#206 targeted run).
    "parser/desugar\\.rs:899:20: delete ! in Parser<'_>::order_lets$",
    # A2 (unreachable), assumes stall_name holds stage indices 0..N-1 only
    # (desugar_pipeline builds it from 0..nstages): at b + 1 == N the `<=`
    # mutant looks up stage N, which is never there.
    "parser/desugar\\.rs:\\d+:\\d+: replace < with <= in Parser<'_>::build_on_block$",
    # A2 (unreachable), the same assumption: `b * 1 < N` lets b = N - 1
    # through, and stall_name has no stage N. Pinned: the same change in
    # `stall_name.get(&(b + 1))` one line below is caught.
    "parser/desugar\\.rs:1073:35: replace \\+ with \\* in Parser<'_>::build_on_block$",
    # A2, assumes the fields of a register take disjoint bit ranges (laid out
    # in order from bit 0, ADR-0044 section 2): OR and XOR of disjoint masks
    # are equal. desugar_blind_spot_tests::mmio_fields_have_disjoint_bit_ranges
    # (fails with an overlapping layout).
    "parser/mmio\\.rs:\\d+:\\d+: replace \\| with \\^ in RegInfo::read_mask$",
    # A2, assumes the generated text declares every reg and let before its
    # first other statement (ADR-0044 section 2): the guard then never sees a
    # declaration after an `on` or an assignment. desugar_blind_spot_tests::
    # generated_mmio_declarations_come_before_every_other_statement (fails
    # when render puts a let after the logic).
    "parser/mmio\\.rs:\\d+:\\d+: replace match guard tail\\.is_empty\\(\\) with true in Parser<'_>::parse_generated$",
    # A2 (unreachable), assumes every if_else caller passes a non-empty else
    # (a boundary without registers is skipped in build_on_block); an empty
    # `else begin end` would be a no-op anyway.
    "parser/desugar\\.rs:\\d+:\\d+: delete match arm 0 in Parser<'_>::if_else$",
    # A2, two SV forms of the same register update, assuming build_on_block
    # tests the bubble only after the next stage's hold:
    # - bubble_cond `!=`: the OR of the conditions instead of `stall_<b>`
    #   when they are equal; `stall_<b>` (a superset) when they differ, which
    #   differs only while a later stage holds, and then the hold wins.
    # - if_else guard `false`: `else begin if ... end end` for `else if`.
    # Reachable; with each mutant the stall, bubble and flush values are the
    # hand-computed ones and P.sv, Q.sv pass `verilator --lint-only -Wall`
    # (desugar_blind_spot_tests::pipeline_stall_bubble_and_flush_have_their_values;
    # #206 targeted run).
    "parser/desugar\\.rs:\\d+:\\d+: replace == with != in Parser<'_>::bubble_cond$",
    "parser/desugar\\.rs:\\d+:\\d+: replace match guard matches!\\(else_stmts\\[0\\], BlockStmt::If\\(_\\)\\) with false in Parser<'_>::if_else$",
]

# Every test of the workspace runs for every mutant: emitter faults are
# caught by tests in other crates (volt-driver's difftest_tests, ADR-0108).
test_workspace = true

# nextest runs the test binaries in parallel and stops at the earliest failure.
# `cargo test` runs them one after the other and the volt-hir and
# volt-sv-emit unit tests come last (after ~8.5 minutes in the tool job), so
# a mutant those tests catch would cost the whole suite.
test_tool = "nextest"

# --max-fail=1:immediate: at the earliest failing test the mutant is caught;
# the tests still running (the differential test alone takes ~75 s) are
# stopped instead of waited for.
# docker_e2e_tests pulls ~650 MB of images and hides the local tools; as in
# the CI tool job it is excluded by name (ADR-0107: it runs in its own job).
additional_cargo_test_args = [
    "--max-fail=1:immediate",
    "-E", "not test(new_test_verify_and_run_through_docker)",
]

# Timeouts. cargo-mutants 27.1.0 tests the baseline (the unmutated tree) with
# the mutated packages alone, even with test_workspace = true (src/lab.rs,
# run_baseline), so a timeout derived from it is far too short for the
# workspace suite that every mutant runs. The workflow therefore runs its own
# baseline (every workspace test, every tool required), measures it and
# passes `--baseline skip --timeout <2 x baseline, at least 300 s>`. Without
# an explicit --timeout (a local try), this floor keeps the workspace suite
# from timing out.
minimum_test_timeout = 600

# A mutation that just adds a warning still builds.
cap_lints = true

# Mutant i runs on shard i % N: files mix across shards, which evens out
# their cost.
sharding = "round-robin"
